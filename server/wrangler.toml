name = "bvr-hockey-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

# the developer's page (admin-ui.js) is imported as text: the Worker hands it to ADMIN_IDS only (coins.js «admin»)
[[rules]]
type = "Text"
globs = ["**/admin-ui.js"]
fallthrough = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# coins and player stats (server/api.js); schema — migrations/, secrets BOT_TOKEN, TG_WEBHOOK_SECRET, ADMIN_IDS — `wrangler secret put …`
[[d1_databases]]
binding = "DB"
database_name = "bvr-hockey"
database_id = "742ae4e9-ec51-4be1-bb03-00c33f01c7fe"

# the test bot's own database (03.10): coins, stakes and stats of players who open the game from the test bot
# (secret BOT_TOKEN_TEST, coins.js authBot); the same migrations — `wrangler d1 migrations apply bvr-hockey-test --remote`
[[d1_databases]]
binding = "DB_TEST"
database_name = "bvr-hockey-test"
database_id = "0a1fdfac-be7a-4ffe-8441-940dc5e01057"
