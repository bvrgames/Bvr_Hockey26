<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070c;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#eef2f7;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
  #stage{position:fixed;inset:0;overflow:hidden;background:#05070c}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  #hud{position:absolute;left:12px;top:10px;z-index:6;pointer-events:none;display:flex;align-items:stretch;
    height:30px;background:linear-gradient(180deg,rgba(16,24,40,.92),rgba(9,14,26,.92));
    border:1px solid rgba(255,255,255,.10);border-radius:8px;overflow:hidden;
    box-shadow:0 3px 14px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
  #hud>div{display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;font-weight:700;letter-spacing:.04em}
  #hud .sc{background:rgba(255,255,255,.08);font-size:14px}
  #hud .clk{color:#ffd166}
  .sw{width:8px;height:15px;border-radius:2px}

  /* Уведомления матча ушли из центра: «Гол», «Офсайд», «Сейв» перекрывали
     именно ту часть площадки, за которой в этот момент и следишь.
     Теперь компактной плашкой сверху, как отложенный офсайд. */
  #msgbox{display:flex;align-items:baseline;gap:8px;
    padding:5px 12px;border-radius:7px;background:rgba(12,18,30,.92);
    border:1px solid rgba(255,255,255,.16);
    opacity:0;transition:opacity .18s;white-space:nowrap;max-width:92vw}
  #msg{font-size:12px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;line-height:1.2}
  #sub{font-size:10px;letter-spacing:.10em;text-transform:uppercase;
    color:rgba(255,255,255,.62);line-height:1.2}

  #rotate{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#05070c;text-align:center;padding:26px;color:#fff}
  #rotate .phone{width:80px;height:150px;border:4px solid #fff;border-radius:28px;position:relative;margin-bottom:18px;
    animation:rotatePhone 2s ease-in-out infinite}
  #rotate .phone::before{content:'';position:absolute;left:50%;top:10px;transform:translateX(-50%);
    width:30px;height:4px;background:#fff;border-radius:2px}
  #rotate .phone::after{content:'';position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    width:20px;height:20px;border:3px solid #fff;border-radius:50%}
  #rotate .arrow{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;
    border-top:20px solid #fff;animation:bounceArrow 1.5s ease-in-out infinite}
  #rotate .text{font-size:14px;letter-spacing:.08em;line-height:1.5;color:rgba(255,255,255,.8)}
  #rotate .brand{font-size:28px;font-weight:800;letter-spacing:.06em;color:#fff;margin-top:14px;text-transform:uppercase;
    font-family:'BVR Sport','Arial Narrow',system-ui,sans-serif;font-style:italic}
  #rotate .brand b{color:#ffd166}
  #rotate .text{margin-top:14px}
  #rotate .rsnd{display:none;margin-top:18px;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;
    color:#8fd8ff;border:1px solid rgba(143,216,255,.4);background:rgba(143,216,255,.08)}
  #rotate.blocked .rsnd{display:block}
  #rotate .rnp{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:12px;
    font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.04em;transition:opacity .5s}
  @keyframes rotatePhone{
    0%,100%{transform:rotate(0deg)}
    25%{transform:rotate(-90deg)}
    75%{transform:rotate(90deg)}
  }
  @keyframes bounceArrow{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(10px)}
  }

  #pad{position:absolute;inset:0;z-index:5;pointer-events:none}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.30);
    background:rgba(14,18,28,.42);backdrop-filter:blur(6px);transition:transform .07s, background .07s}
  .btn b{font-size:15px;font-weight:800;line-height:1}
  /* подпись переносится и ужимается под размер круга (fitPadLabels) */
  .btn i{font-style:normal;font-size:8.5px;letter-spacing:.04em;opacity:.9;margin-top:2px;text-transform:uppercase;
    display:block;max-width:82%;text-align:center;line-height:1.05;white-space:normal;overflow-wrap:break-word}
  #bRT i{max-width:92%}
  .btn.press{transform:scale(.88);background:rgba(255,255,255,.34)}
  #bPause.press{background:rgba(255,255,255,.34)}
  #bA{background:rgba(28,120,60,.42);border-color:rgba(110,225,150,.6)}
  #bB{background:rgba(140,36,44,.42);border-color:rgba(240,130,130,.6)}
  #bX{background:rgba(28,72,150,.42);border-color:rgba(130,175,255,.6)}
  #bY{background:rgba(150,120,20,.42);border-color:rgba(255,215,110,.6)}
  #bRT{border-radius:14px;background:rgba(40,48,64,.5)}
  #stick{position:absolute;pointer-events:none;z-index:5}
  /* Автоскрытие сенсорного управления: с геймпадом или на ПК кнопки только
     закрывают обзор. Гаснут через паузу без касаний, возвращаются мгновенно. */
  #pad,#stick{transition:opacity .40s ease}
  #pad.idle,#stick.idle{opacity:0}

  #power{position:absolute;z-index:6;height:7px;border-radius:4px;
    background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);overflow:hidden;opacity:0;transition:opacity .15s}
  #power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff6b3d)}

  #hud2{position:absolute;left:12px;top:44px;z-index:6;pointer-events:none;font-size:11.5px;font-weight:700;
    letter-spacing:.05em;color:#ffb454;font-variant-numeric:tabular-nums;
    text-shadow:0 2px 8px rgba(0,0,0,.7);opacity:0;transition:opacity .2s}
  /* Верхняя полоса уведомлений: отложенный офсайд и плашки матча стоят
     в одном стеке и не наезжают друг на друга. Центр площадки остаётся чистым. */
  #topbar{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:7;
    display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;
    max-width:92vw}
  body.portrait #topbar{top:46px}
  #chip{padding:5px 12px;border-radius:7px;background:rgba(210,140,30,.92);color:#1d1305;
    font-size:11px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;
    opacity:0;transition:opacity .18s;white-space:nowrap}
  body.portrait #legend{display:none}
  body.portrait #hud{left:8px;top:8px}
  body.portrait #hud>div{padding:0 7px;font-size:11px}
  body.portrait #chip{top:46px}
  body.portrait #hud2{top:42px;left:8px}
  #legend{position:absolute;right:10px;top:48px;z-index:6;   /* под кнопкой паузы */
    font-size:10px;line-height:1.5;
    color:rgba(255,255,255,.5);text-align:right;pointer-events:none}
  #fps{position:absolute;left:10px;bottom:8px;z-index:9;pointer-events:none;font-size:11px;font-weight:700;
    letter-spacing:.03em;color:#8fe3a0;background:rgba(6,10,18,.72);
    border:1px solid rgba(143,227,160,.28);border-radius:6px;padding:3px 8px;
    font-variant-numeric:tabular-nums}
  body.portrait #fps{bottom:auto;top:108px}   /* ниже полосы уведомлений */
  .chips{display:flex;gap:5px}
  .chip{flex:1;min-width:0;padding:8px 2px;border-radius:8px;cursor:pointer;text-align:center;
    border:2px solid transparent;font-size:9.5px;font-weight:800;letter-spacing:.03em;
    color:rgba(255,255,255,.92);opacity:.55;transition:.13s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.on{opacity:1;border-color:#fff}
  .chip.dis{opacity:.18;cursor:not-allowed}
  .chip.opt{background:rgba(255,255,255,.09);opacity:.6;line-height:1.3}
  .chip.opt small{font-size:8px;font-weight:600;opacity:.75}
  .chip.opt.on{background:#ffd166;color:#241703;opacity:1;border-color:#fff}

  #toast{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:8;
    padding:8px 18px;border-radius:9px;background:rgba(12,18,30,.9);
    border:1px solid rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:800;
    letter-spacing:.06em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  #tacbadge{position:absolute;right:10px;bottom:10px;z-index:6;font-size:10px;font-weight:800;
    letter-spacing:.09em;color:rgba(255,255,255,.42);pointer-events:none;text-transform:uppercase}
  body.portrait #toast{bottom:auto;top:78px}
  /* обрыв связи в сетевом матче: «переподключение…» / «соперник переподключается…» */
  #netban{position:absolute;left:50%;transform:translateX(-50%);top:56px;z-index:8;
    padding:6px 14px;border-radius:9px;background:rgba(30,20,6,.9);
    border:1px solid rgba(255,190,80,.5);color:#ffd48a;font-size:12px;font-weight:800;
    letter-spacing:.05em;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}

  #bPause{position:absolute;pointer-events:auto;z-index:7;width:34px;height:34px;border-radius:9px;
    border:1.5px solid rgba(255,255,255,.28);background:rgba(14,18,28,.5);
    display:flex;align-items:center;justify-content:center;gap:4px}
  #bPause span{display:block;width:4px;height:14px;border-radius:1px;background:rgba(255,255,255,.85)}
  #bPause:active{background:rgba(255,255,255,.3)}

  /* отладочные индикаторы (скорость, FPS, сетевые счётчики) видны только с ?debug */
  body:not(.debug) .dbg{display:none!important}
  /* FPS — настройка игрока (меню/пауза) или ?debug */
  body:not(.debug):not(.showfps) #fps{display:none!important}
  /* подсказки геймпада на экране матча — только когда геймпад подключён */
  body:not(.pad) .padhint{display:none!important}

  /* ============ меню (docs/MENU_PLAN.md) ============
     Всё с префиксом m*, чтобы не задеть классы матча (.btn — экранные кнопки, .sw — табло).
     Отступы от краёв (--mt/--ml/--mr/--mb) ставит mLayout(): зона устройства + полоса кнопок Telegram. */
  :root{--mt:54px;--ml:18px;--mr:18px;--mb:10px;--mgold:#ffd166;--mgold2:#f0a92e;--mcyan:#8fd8ff;--mmag:#c325d8;--mblu:#2585ff;
    --mdim:#9fb3c9;--mmute:#6f86a1;--msport:'BVR Sport','Arial Narrow',system-ui,-apple-system,sans-serif}
  .mroot,.mlay{color:#f2f7ff;touch-action:manipulation;-webkit-font-smoothing:antialiased}
  #start.mroot{position:absolute;inset:0;z-index:15;overflow:hidden;background:#040b16}
  #start.overgame{background:rgba(4,9,18,.8)}
  #start.m3d{background:transparent}
  /* под прозрачным меню — только арена: табло, кнопки, пауза, подсказки матча скрыты */

  #start.m3d .mbg{opacity:.62}
  #start.m3d .mbg .ice,#start.m3d .mbg .lights{display:none}
  #start.overgame .mbg,#start.overgame .msnow,#start.overgame .mnp{display:none}
  .mlay{position:absolute;inset:0;z-index:18;display:none;background:rgba(4,9,18,.74)}
  #overscr.mlay{background:rgba(4,9,18,.84)}
  .mbg{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(120% 60% at 70% -10%,rgba(120,190,255,.28),transparent 60%),
      radial-gradient(60% 40% at 15% 0%,rgba(195,37,216,.18),transparent 70%),linear-gradient(180deg,#0a1c33 0%,#040b16 55%)}
  .mbg .ice{position:absolute;left:-10%;right:-10%;bottom:-2%;height:48%;transform:perspective(600px) rotateX(58deg);transform-origin:50% 100%;
    background:repeating-linear-gradient(90deg,transparent 0 11%,rgba(255,255,255,.035) 11% 11.3%),
      linear-gradient(90deg,transparent 47%,rgba(220,40,60,.45) 47% 48.2%,transparent 48.2%),
      linear-gradient(90deg,transparent 30%,rgba(40,110,230,.4) 30% 31%,transparent 31% 64%,rgba(40,110,230,.4) 64% 65%,transparent 65%),
      radial-gradient(50% 70% at 50% 100%,rgba(170,220,255,.55),transparent 70%),linear-gradient(180deg,#123356,#2a6690)}
  .mbg .ice::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,255,255,.05) 18px 19px,transparent 19px 47px),
      repeating-linear-gradient(64deg,transparent 0 31px,rgba(255,255,255,.04) 31px 32px,transparent 32px 70px)}
  .mbg .lights{position:absolute;left:0;right:0;top:6%;height:18%;filter:blur(1px);
    background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent) 12% 40%/60px 60px no-repeat,
      radial-gradient(closest-side,rgba(255,255,255,.45),transparent) 38% 20%/48px 48px no-repeat,
      radial-gradient(closest-side,rgba(255,255,255,.5),transparent) 64% 30%/56px 56px no-repeat,
      radial-gradient(closest-side,rgba(255,255,255,.45),transparent) 88% 45%/52px 52px no-repeat}
  .mbg .drift{position:absolute;bottom:-40px;width:60%;height:120px;border-radius:50%;filter:blur(6px);
    background:radial-gradient(closest-side,rgba(235,246,255,.95),rgba(200,225,245,.55) 60%,transparent)}
  .mbg .drift.l{left:-22%}.mbg .drift.r{right:-24%;bottom:-54px}
  .mbg .frost{position:absolute;inset:0;background:radial-gradient(40% 30% at 0% 100%,rgba(225,240,255,.35),transparent 70%),
    radial-gradient(35% 28% at 100% 100%,rgba(225,240,255,.32),transparent 70%),radial-gradient(30% 22% at 100% 0%,rgba(225,240,255,.12),transparent 70%)}
  .mbg .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,8,16,.82) 0%,rgba(3,8,16,.45) 42%,rgba(3,8,16,0) 65%)}
  .msnow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .msnow i{position:absolute;top:-10px;border-radius:50%;background:#fff;animation:mfall linear infinite}
  @keyframes mfall{to{transform:translate3d(var(--dx),110vh,0)}}
  @media (prefers-reduced-motion:reduce){.msnow{display:none}}

  .mscr{position:absolute;inset:0;display:none;gap:4px 18px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "left right";
    padding:var(--mt) var(--mr) calc(var(--mb) + 46px) var(--ml)}
  .mscr.cur{display:grid}
  .mscr.wide .mleft{grid-column:1/3}
  .mhead{grid-area:head;display:flex;align-items:flex-end;gap:12px;min-width:0}
  .mleft{grid-area:left;min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .mright{grid-area:right;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .mfoot{position:absolute;left:var(--ml);right:var(--mr);bottom:var(--mb);height:40px;display:flex;align-items:center;
    justify-content:space-between;gap:12px;pointer-events:none}
  .mfoot>*{pointer-events:auto}
  .mbrand{font:italic 800 28px/.95 var(--msport);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
    text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 24px rgba(37,133,255,.35)}
  .mbrand b{color:var(--mgold);font-weight:800}
  .mbrand::after{content:'';display:block;height:2px;width:62%;margin-top:3px;background:linear-gradient(90deg,var(--mgold),var(--mmag) 45%,transparent)}
  .mbrand.sm{font-size:14px;opacity:.85;text-shadow:none}.mbrand.sm::after{display:none}
  .mcrumb{display:flex;flex-direction:column;gap:2px;min-width:0}
  .mtitle{font:italic 800 25px/1 var(--msport);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mback{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;flex:none;cursor:pointer;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font:800 22px/1 system-ui;color:#fff}
  .mroot.ownback .mback{display:flex}
  .mpill{font:italic 800 12px/1 var(--msport);text-transform:uppercase;letter-spacing:.04em;padding:6px 10px;border-radius:999px;
    background:rgba(143,216,255,.14);color:var(--mcyan);border:1px solid rgba(143,216,255,.3);white-space:nowrap}
  .mf{cursor:pointer}

  /* список пунктов: выбранный — полоса с градиентом, затухает вправо */
  .mlist{display:flex;flex-direction:column;gap:1px;margin-top:2px}
  .mi{position:relative;z-index:0;padding:3px 0 3px 4px;font:italic 800 clamp(19px,6.2vh,27px)/1.06 var(--msport);text-transform:uppercase;
    color:rgba(214,228,244,.66);white-space:nowrap}
  .mi .d{display:block;font:600 11px/1.25 system-ui,-apple-system,sans-serif;letter-spacing:.02em;text-transform:none;color:var(--mdim);
    margin-top:1px;white-space:normal;max-width:34em}
  .mi:not(.on) .d{display:none}
  .mi.on{color:#fff}
  .mi.on::before{content:'';position:absolute;z-index:-1;top:0;bottom:0;left:calc(-1 * var(--ml));right:-30%;
    background:linear-gradient(90deg,var(--mgold) 0 5px,rgba(37,133,255,.95) 5px,rgba(37,133,255,.55) 38%,rgba(195,37,216,.18) 70%,transparent);
    clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%)}
  .mi.on::after{content:'›';position:absolute;right:-6px;top:50%;transform:translateY(-55%);font:800 28px/1 system-ui;color:var(--mgold)}
  .mi.dis{opacity:.42}
  .mi .soon{font:italic 800 11px/1 var(--msport);margin-left:8px;padding:3px 7px;border-radius:999px;vertical-align:middle;
    color:var(--mcyan);border:1px solid rgba(143,216,255,.35)}
  .mlist.sm .mi{font-size:clamp(17px,5.4vh,23px)}

  .mglass{background:linear-gradient(180deg,rgba(18,40,70,.8),rgba(8,20,38,.85));border:1px solid rgba(143,216,255,.18);border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
  .mcard{padding:10px 14px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:7px}
  .mcard h3{margin:0;font:italic 800 19px/1.05 var(--msport);text-transform:uppercase}
  .mnote{font:600 12px/1.38 system-ui,-apple-system,sans-serif;color:#dbe6f3}
  .mnote.dim{color:var(--mdim)}
  .mrow{position:relative;display:flex;align-items:center;gap:10px;padding:5px 12px;border-radius:10px;min-height:34px}
  .mrow .k{flex:1;font:italic 800 15px/1.1 var(--msport);text-transform:uppercase;color:var(--mdim);white-space:nowrap}
  .mrow .v{display:flex;align-items:center;gap:8px;font:italic 800 16px/1 var(--msport);text-transform:uppercase;white-space:nowrap}
  .mrow .ar{color:var(--mgold);font:800 18px/1 system-ui;padding:2px 4px}
  .mrow.on{background:linear-gradient(90deg,rgba(37,133,255,.55),rgba(37,133,255,.12) 70%,transparent);box-shadow:inset 4px 0 0 var(--mgold)}
  .mrow.on .k{color:#fff}
  .mrow.ro .ar{visibility:hidden}
  .mtog{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;flex:none}
  .mtog::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfd8e3;transition:left .15s}
  .mtog.on{background:linear-gradient(90deg,var(--mblu),var(--mcyan))}.mtog.on::after{left:23px;background:#fff}
  .mbar{width:120px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);position:relative;flex:none;margin-right:8px}
  .mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--mblu),var(--mcyan))}
  .mbar i::after{content:'';position:absolute;right:-8px;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(37,133,255,.5)}
  .mbar::before{content:'';position:absolute;inset:-12px 0}   /* зона касания шире полосы */
  #start .mseg{display:flex;gap:5px}
  #start .mseg .chip{flex:0 0 auto;padding:6px 9px;border-radius:9px;border:0;font:italic 800 13px/1 var(--msport);text-transform:uppercase;
    letter-spacing:.02em;color:var(--mdim);background:rgba(255,255,255,.08);opacity:1}
  #start .mseg .chip.on{color:#241703;background:linear-gradient(180deg,var(--mgold),var(--mgold2))}
  .mbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:42px;padding:0 20px;border-radius:12px;border:0;
    font:italic 800 19px/1 var(--msport);text-transform:uppercase;color:#241703;white-space:nowrap;cursor:pointer;
    background:linear-gradient(180deg,var(--mgold),var(--mgold2));box-shadow:0 6px 20px rgba(240,169,46,.3),inset 0 1px 0 rgba(255,255,255,.5)}
  .mbtn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .mbtn.on{outline:3px solid #fff;outline-offset:2px}
  .mbtn:disabled,.mbtn.dis{opacity:.45;cursor:default}

  /* подвал: «сейчас играет» (одна строка) и подсказки кнопок */
  .mnp{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 9px;border-radius:10px;min-width:0;max-width:48%;
    background:linear-gradient(90deg,rgba(6,14,28,.85),rgba(6,14,28,.5));border-left:3px solid var(--mmag)}
  .mnp.off{visibility:hidden}
  .meq{display:flex;align-items:flex-end;gap:2px;height:14px;flex:none}
  .meq i{width:3px;height:100%;border-radius:1px;background:linear-gradient(180deg,var(--mcyan),var(--mblu));animation:meq 1s ease-in-out infinite alternate}
  .meq i:nth-child(2){animation-delay:-.4s}.meq i:nth-child(3){animation-delay:-.7s}.meq i:nth-child(4){animation-delay:-.2s}
  .mnp.paused .meq i{animation:none;transform:scaleY(.3)}
  @keyframes meq{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
  .mnptx{font:italic 800 13px/1.1 var(--msport);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .45s}
  .mnptx.fade{opacity:0}
  .mnptx small{font:700 11px/1 system-ui;color:var(--mcyan);margin-left:8px;font-style:normal;text-transform:none}
  .mhints{display:flex;gap:12px;align-items:center;flex:none;margin-left:auto}
  .mh{display:flex;align-items:center;gap:6px;font:italic 800 13px/1 var(--msport);text-transform:uppercase;color:var(--mdim);white-space:nowrap}
  .mg{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;border-radius:50%;padding:0 5px;
    font:800 11px/1 system-ui;color:#0a1420;font-style:normal}
  .mg.a{background:#5ad07f}.mg.b{background:#e8736f}.mg.x{background:#7fb0ff}.mg.y{background:#ffd166}
  .mg.r{background:#b9c4d6;border-radius:6px}
  .mg.key{background:#dfe7f1;border-radius:5px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);font-size:10px}

  /* профиль (карточка на главном и экран) и магазин */
  .mprof{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px 8px 8px;border-radius:14px;max-width:320px;min-width:0}
  .mprof .pmini{flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .mprof .pmini span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 2px;border-radius:7px;background:rgba(255,255,255,.06);
    font:700 7.5px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--mmute);white-space:nowrap;overflow:hidden}
  .mprof .pmini b{font:italic 800 14px/1 var(--msport);color:#fff;letter-spacing:0}
  .mprof.on,.mprofbig.on,.mshop.on{box-shadow:0 0 0 2px var(--mgold),0 10px 30px rgba(0,0,0,.35)}
  .mprof .pn,.mprofbig .pn{display:flex;flex-direction:column;gap:3px;min-width:0}
  .mprof .pn b{font:italic 800 16px/1 var(--msport);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mprof .pn i{font:700 11px/1.1 system-ui;font-style:normal;color:var(--mdim);white-space:nowrap}
  .mava{position:relative;flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--mmag),var(--mblu));box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .mava b{font:italic 800 19px/1 var(--msport);color:#fff}
  .mava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .mava.big{width:64px;height:64px}.mava.big b{font-size:30px}
  /* валюта: иконка (assets/src/icons → <symbol> в начале <body>) рядом с числом, высотой с цифры */
  .cval{display:inline-flex;align-items:center;gap:.24em;white-space:nowrap;vertical-align:-.12em}
  .cval .cn{font:inherit;color:inherit}
  .mnote .ic{margin:0 .18em 0 .1em}
  .ic{display:inline-block;flex:none;width:.8em;height:.8em;vertical-align:-.08em}
  .mpill.mwal{display:inline-flex;gap:12px;color:#fff;font-size:14px;letter-spacing:.02em;text-transform:none}
  .mwallet{display:flex;align-items:center;justify-content:space-around;gap:18px;width:100%;max-width:320px;padding:10px 16px;
    font:italic 800 26px/1 var(--msport);color:#fff;letter-spacing:.01em}
  .mprofbig{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;max-width:380px}
  .mprofbig .pn b{font:italic 800 22px/1 var(--msport);text-transform:uppercase}
  .mprofbig .pn i{font:700 12px/1 system-ui;font-style:normal;color:var(--mdim)}
  .mprofbig .mpill{align-self:flex-start;margin-top:3px}
  .mprofbig .mpill.mwal{font-size:19px;padding:6px 12px}
  .mstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;max-width:380px}
  .pst{display:flex;flex-direction:column;gap:3px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06)}
  .pst b{font:italic 800 21px/1 var(--msport)}
  .pst span{font:700 9px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--mmute)}
  .mwel{display:flex;flex-direction:column;gap:8px;max-width:440px}
  .mwt{font:italic 800 clamp(22px,7vh,32px)/1.05 var(--msport);text-transform:uppercase;color:var(--mgold)}
  .mshopg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .mshop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;border-radius:14px;text-align:center}
  .mshop svg{width:min(15vh,64px);height:auto}
  .mshop b{font:italic 800 15px/1.05 var(--msport);text-transform:uppercase}
  .mshop i{font:600 10.5px/1.25 system-ui;font-style:normal;color:var(--mdim)}
  .mshop .soon{position:absolute;top:8px;right:8px;font:italic 800 10px/1 var(--msport);padding:3px 6px;border-radius:999px;color:var(--mcyan);border:1px solid rgba(143,216,255,.35)}
  /* пополнение звёзд: кнопка «+» у звёзд в кошельке и экран пакетов */
  .mtopup{display:inline-flex;align-items:center;gap:2px;margin-left:-6px;padding:4px 8px 4px 6px;border-radius:999px;cursor:pointer;
    font:italic 800 .62em/1 var(--msport);color:#241703;background:linear-gradient(180deg,var(--mgold),var(--mgold2));
    box-shadow:0 3px 10px rgba(240,169,46,.3);text-transform:none;letter-spacing:0;vertical-align:middle}
  .mtopup .ic{width:1em;height:1em}
  .mtopup b{font:800 1.25em/1 system-ui;margin-left:1px}
  .mtopup.on{outline:3px solid #fff;outline-offset:2px}
  .msb{display:flex;flex-direction:column;gap:10px;max-width:660px}
  .msbg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .msbp{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px 12px;border-radius:14px;text-align:center}
  .msbp .ic{width:min(12vh,52px);height:min(12vh,52px);filter:drop-shadow(0 4px 12px rgba(255,209,102,.35))}
  .msbp b{font:italic 800 30px/1 var(--msport);color:#fff}
  .msbp i{font:700 11px/1.2 system-ui;font-style:normal;color:var(--mdim)}
  .msbp .bon{position:absolute;top:8px;right:8px;font:italic 800 11px/1 var(--msport);padding:3px 6px;border-radius:999px;color:#241703;background:var(--mgold)}
  .msbp.on{box-shadow:0 0 0 2px var(--mgold),0 10px 30px rgba(0,0,0,.35)}
  .msbp.dis{opacity:.5}
  .msbst{min-height:18px;font:700 12.5px/1.3 system-ui;color:var(--mcyan);display:flex;align-items:center;gap:8px}
  .msbst.ok{color:#5ad07f;font:italic 800 17px/1 var(--msport);text-transform:uppercase}
  .msbst.bad{color:#ffb4a8}
  #start [data-stars]{display:inline-block;transition:transform .12s}
  #start [data-stars].pop{transform:scale(1.15)}
  #start [data-coins]{display:inline-block;transition:transform .12s}
  #start [data-coins].pop{transform:scale(1.15)}
  /* Магазин: монеты за звёзды */
  .mshh{margin:2px 0 5px;font:italic 800 14px/1 var(--msport);text-transform:uppercase;color:var(--mgold);letter-spacing:.03em}
  .mshcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:560px}

  .mshc>.ic{width:30px;height:30px}

  .mshc .pr{margin-left:auto;padding:4px 9px;border-radius:999px;font:italic 800 15px/1 var(--msport);color:#241703;background:linear-gradient(180deg,var(--mgold),var(--mgold2))}
  .mshc.on,.mshc.sel{box-shadow:0 0 0 2px var(--mgold),0 10px 30px rgba(0,0,0,.35)}
  .mshq{display:flex;align-items:center;gap:10px;min-height:44px;margin:6px 0 6px;font:700 13px/1.3 system-ui;color:#dbe6f3}

  .mshopg.sm{gap:8px}

  .mshopg.sm .mshop b{font-size:13px}
  .mshopg.sm .mshop .soon{position:static;margin-left:auto}

  /* медали */
  .md{display:inline-block;width:15px;height:15px;border-radius:50%;flex:none;vertical-align:middle;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.25)}
  .md.g{background:radial-gradient(circle at 35% 30%,#fff3b0,#f2b92c 55%,#a8740c)}
  .md.s{background:radial-gradient(circle at 35% 30%,#fff,#c3ccd8 55%,#7d8796)}
  .md.b{background:radial-gradient(circle at 35% 30%,#ffd9b0,#c9803c 55%,#80471a)}
  .md.e{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
  .md.big{width:clamp(48px,15vh,72px);height:clamp(48px,15vh,72px)}

(function(){

/* отметки загрузки (мс от начала навигации): script — начало скрипта игры, gl — сцена и шейдеры готовы, menu — меню работает, players — модели */
var BOOT={script:Math.round(performance.now())};

/* ============================================================
   ЛИГА 5 НА 5 — аркадный хоккей
   собственный софт-рендер, геймпад + экранные кнопки
   ============================================================ */

/* ---------- режим автотестов (tools/smoke.mjs, tools/play.mjs) ----------
   Всё включается только параметрами ссылки, обычной игре не мешает:
     ?autostart[=сек]  сразу начать матч (без меню); число — длина матча в секундах
     ?autopilot        команду игрока ведёт тот же ИИ, что и соперника
     ?seed=N           предсказуемый Math.random (одинаковые решения ИИ от прогона к прогону)
     ?frozen           старт в заморозке: игра идёт только через __hk.step — полностью воспроизводимо
     ?ai=easy|hard     уровень ИИ соперника (по умолчанию normal)
     ?side=1           в одиночной игре играть за команду 1 (проверка симметрии)
     ?debug            показать отладочные индикаторы: скорость, FPS, сетевые счётчики
   Идея и формат прогонов взяты из INKWAVE (Jayden Davis, MIT) — см. THIRD_PARTY.md. */
var TEST=(function(){
  var q=new URLSearchParams(location.search);
  var t={autostart:q.has('autostart'), autoLen:+q.get('autostart')||0,
         autopilot:q.has('autopilot'), seed:q.has('seed')?(+q.get('seed')||1):0,
         frozen:q.has('frozen'), skipRender:false, errors:[],
         ai:({easy:1,normal:1,hard:1})[q.get('ai')]?q.get('ai'):null,
         side:q.get('side')==='1'?1:0, debug:q.has('debug')};
  /* Внутри Telegram к ссылке мини-приложения ?debug не допишешь — отладка включается стартовым
     параметром: t.me/bvr_games_bot/hockeytg?startapp=dbg (или dbg_КОД — сразу в комнату) */
  /* startapp: префиксы dbg_ (отладка) и host_ (матч считает телефон хоста — запасная схема) в любом порядке,
     дальше — код комнаты: dbg, host, dbg_КОД, host_КОД, host_dbg_КОД. Старый префикс srv_ принимается и ничего
     не меняет: серверная схема и так по умолчанию (фаза 3.5). */
  t.startParam=function(sp){
    var o={dbg:false, srv:false, host:false, room:''}, m;
    sp=String(sp||'');
    while((m=/^(dbg|srv|host)(?:_|$)/i.exec(sp))){ o[m[1].toLowerCase()]=true; sp=sp.slice(m[0].length); }
    o.room=sp; return o;
  };
  var sp0=null;
  try{ sp0=window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.start_param; }catch(e){}
  t.sp=t.startParam(sp0);
  if(t.sp.dbg) t.debug=true;
  /* Сетевой матч считает сервер (по умолчанию, фаза 3.5). ?net=host / startapp=host… — хост-схема вручную.
     Решает тот, кто открывает комнату; если сервер серверного режима не знает или молчит — хост-схема сама. */
  t.srv = !(q.get('net')==='host' || t.sp.host);
  /* ?debug — показать отладочные индикаторы (класс .dbg): скорость, FPS, сеть */
  if(t.debug) document.body.classList.add('debug');
  if(t.seed){
    /* mulberry32 */
    var a=t.seed>>>0;
    Math.random=function(){ a|=0; a=(a+0x6d2b79f5)|0; var r=Math.imul(a^(a>>>15),1|a);
      r=(r+Math.imul(r^(r>>>7),61|r))^r; return ((r^(r>>>14))>>>0)/4294967296; };
  }
  window.addEventListener('error',function(e){ t.errors.push(String(e.message||e)); });
  window.addEventListener('unhandledrejection',function(e){ t.errors.push('rejection: '+String(e.reason)); });
  return t;
})();

/* ---------- шина игровых событий (docs/EVENTS.md) ----------
   Симуляция только сообщает, что случилось: EV.emit('shot', {...}).
   Звук, вибро, камера, надписи и статистика подписываются: EV.on('shot', fn).
   Payload — только простые данные (номера игроков в players[], команды, числа),
   без ссылок на объекты: те же события уходят гостю по сети, а итог матча —
   на сервер. Схема из INKWAVE (Jayden Davis, MIT) — см. THIRD_PARTY.md. */
var EV=(function(){
  var L={}, seq=0;
  /* события, которые хост пересылает гостю (остальные каждая сторона шлёт себе сама) */
  var NETWORKED={faceoff:1, pass:1, 'pass:recv':1, shot:1, save:1, post:1, goal:1,
                 hit:1, penalty:1, stoppage:1, poke:1, pickup:1, 'match:end':1};
  return {
    NETWORKED:NETWORKED,
    on:function(name,fn){ (L[name]||(L[name]=[])).push(fn);
      return function(){ var a=L[name], i=a?a.indexOf(fn):-1; if(i>=0) a.splice(i,1); }; },
    emit:function(name,e){
      e=e||{};
      /* номер нужен только пересылаемым событиям: по нему гость отбрасывает повторы */
      if(NETWORKED[name] && e.seq===undefined) e.seq=++seq;
      var a=L[name], b=L['*'];
      /* ошибка в одном подписчике не должна ронять симуляцию и остальных */
      if(a) for(var i=0;i<a.length;i++){ try{ a[i](e,name); }catch(x){ TEST.errors.push('EV '+name+': '+x); console.error('EV '+name, x); } }
      if(b) for(var j=0;j<b.length;j++){ try{ b[j](e,name); }catch(x){ TEST.errors.push('EV *: '+x); console.error('EV *', x); } }
      return e;
    }
  };
})();

/* Стартовый уровень по устройству (чистая функция — её же гоняет отчёт по типичным устройствам).
   Начинаем скромно: подняться автоподстройка успеет за пару секунд, а тормоза в первые
   секунды на слабом телефоне заметны сразу. */
function qualityGuess(d){
  var gpu=(d.gpu||'').toLowerCase(), ua=d.ua||'', plat=d.platform||'';
  var L=Math.max(d.sw,d.sh), S=Math.min(d.sw,d.sh);
  if(/swiftshader|llvmpipe|software|basic render/.test(gpu)) return {level:0, reason:'программная отрисовка ('+d.gpu+')'};
  var ios = plat==='ios' || /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && d.touch);
  var android = plat==='android' || plat==='android_x' || /Android/.test(ua);
  if(ios){
    if(S>=744) return {level:2, reason:'iPad'};
    if(L<=568) return {level:0, reason:'маленький iPhone (5s / SE 1-го поколения, A7–A9)'};
    if(L<=667) return {level:1, reason:'iPhone 6–8 / SE 2–3 (A8–A15, по экрану не различить)'};
    return {level:1, reason:'iPhone X и новее (A11+): старт со среднего, дальше автоподстройка'};
  }
  if(android){
    var weakGpu=/mali-4|mali-t|mali-g(31|51|52|57)\b|adreno \(tm\) ([2-4]\d\d|50\d|51\d)|powervr (sgx|rogue ge)/.test(gpu);
    var strongGpu=/adreno \(tm\) (6[4-9]\d|7\d\d|8\d\d)|mali-g(6[89]|7[1-9]|[89]\d|6[1-9]\d|7[1-9]\d)|xclipse|immortalis/.test(gpu);
    if(weakGpu || (d.cores && d.cores<=4) || (d.mem && d.mem<=3)) return {level:0, reason:'слабый Android ('+(d.gpu||'GPU ?')+', ядер '+(d.cores||'?')+', ОЗУ '+(d.mem||'?')+' ГБ)'};
    if(strongGpu && d.cores>=8) return {level:1, reason:'сильный Android ('+d.gpu+'): старт со среднего'};
    return {level:0, reason:'Android без явных признаков силы: старт с низкого'};
  }
  var desktop = /tdesktop|macos|weba|webk|web$/.test(plat) || (!d.touch && !/Mobi/.test(ua));
  if(desktop){
    if(/intel.*(hd|uhd) graphics [2-6]\d\d\b|intel.*hd graphics$/.test(gpu)) return {level:1, reason:'компьютер со старой встроенной графикой'};
    return {level:2, reason:'компьютер'};
  }
  return {level:1, reason:'неизвестное мобильное устройство'};
}

/* ---------- модели хоккеистов: отдельные файлы, грузятся параллельно с разбором страницы ----------
   tools/pack-assets.mjs: players-lo.<хеш>.bin — скелет, клипы, анимация и упрощённые модели (LOD, свой
   компактный набор вершин): их хватает любому уровню. Качать его начинает скрипт в <head>; меню его не
   ждёт, старт матча — ждёт (экран загрузки с процентами). players-hi.<хеш>.bin — полные модели, только
   для высокого качества: качаются, когда оно понадобилось, до тех пор рисуются упрощённые.
   Формат: 'BVR1', длина заголовка, заголовок JSON (массивы — как [смещение, длина]), массивы без base64. */
var HD_DATA=null;
var PLAYERS={loaded:0, total:0, done:false, failed:false, cbs:[]};
function playersParse(buf){
  var dv=new DataView(buf);
  if(String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3))!=='BVR1') throw new Error('players: bad file');
  var hl=dv.getUint32(4,true), base=8+hl;
  var head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,8,hl)));
  function u8(r){ return new Uint8Array(buf, base+r[0], r[1]); }
  for(var k in head){
    var m=head[k];
    if(m.anim) m.anim=u8(m.anim);
    if(m.geo) m.geo.mesh=u8(m.geo.mesh);
  }
  return head;
}
function playersDone(ok){

  loadingPaint();

}
function playersLoad(tries){
  PLAYERS.total=ASSETS.loBytes||0; PLAYERS.loaded=0;
  /* первая попытка — запрос, начатый ещё в <head>; повторы — новые */
  var req=(!tries && window.PLAYERS_FETCH) ? window.PLAYERS_FETCH : fetch(ASSETS.lo);
  req.then(function(r){
    if(!r.ok) throw new Error('players: HTTP '+r.status);
    if(!r.body || !r.body.getReader) return r.arrayBuffer();
    /* по кускам — ради процентов на экране загрузки (размер — из манифеста: content-length сжатый) */
    var rd=r.body.getReader(), parts=[], n=0;

      if(x.done){ var out=new Uint8Array(n), o=0; for(var i=0;i<parts.length;i++){ out.set(parts[i],o); o+=parts[i].length; } return out.buffer; }
      parts.push(x.value); n+=x.value.length; PLAYERS.loaded=n; loadingPaint(); return pump(); }); })();
  }).then(function(buf){
    HD_DATA=playersParse(buf); playersDone(true);
  }).catch(function(e){
    console.warn('модели игроков не загрузились:', e);
    if(tries<2) setTimeout(function(){ playersLoad(tries+1); }, 1500*(tries+1));
    else playersDone(false);              /* играем простыми фигурами — лучше, чем не играть */
  });
}

/* Размер окна берём у visualViewport: в мобильных webview innerWidth/Height

   успевала решить, что она в горизонтали, хотя телефон стоял вертикально —

function viewSize(){
  var vv=window.visualViewport;
  var w=vv?vv.width:window.innerWidth, h=vv?vv.height:window.innerHeight;
  var tg=(typeof TG!=='undefined')?TG:null;
  if(tg && tg.viewportStableHeight>0) h=Math.max(h, tg.viewportStableHeight);
  return [Math.max(320,Math.round(w)), Math.max(240,Math.round(h))];

function isDesktopTG(){
  var tg=window.Telegram && window.Telegram.WebApp;

var TG_BTN_W=100;          /* ширина группы «⌄ •••» справа (API её не даёт — с запасом) */

   не даёт — эвристика с запасом. */
function tgCloseW(){
  var plat=(TG && TG.platform)||'', lc='';
  try{ lc=((TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.language_code)||'').slice(0,2).toLowerCase(); }catch(e){}
  if(plat==='android' || plat==='android_x') return 64;

var PAD_R=40;
var _envProbe=null;
function envInsets(){
  if(!_envProbe){

      'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';

function tgInset(o){ return o ? {t:+o.top||0, r:+o.right||0, b:+o.bottom||0, l:+o.left||0} : null; }

function _px(el,x,y){ el.style.left=Math.round(x)+'px'; el.style.top=Math.round(y)+'px'; el.style.right='auto'; el.style.bottom='auto'; }
function layoutTop(){
  var hud=document.getElementById('hud'); if(!hud) return;
  var SA=safeInsets(), band=tgButtonsBand();

  var hw=hud.offsetWidth||260, hh=hud.offsetHeight||30;
  var hudX, hudY;
  if(band>0 && !PORTRAIT){
    /* горизонталь, полный экран: табло сразу правее «Закрыть», в том же ряду и по центру ряда
       по высоте; не помещается до «⌄ •••» — ниже полосы кнопок, у левого края */
    var freeL=SA.l+tgCloseW()+8, freeR=W-SA.r-TG_BTN_W-8;
    if(freeL+hw<=freeR && hh<=band){ hudX=freeL; hudY=top0+(band-hh)/2; }
    else { hudX=SA.l+12; hudY=below+6; }

  } else {

  if(hudY<pB+4 && hudY+hh>pY-4 && hudX+hw>pX-6){
    hudX=Math.max(SA.l+8, Math.min(hudX, pX-6-hw));
    if(hudX+hw>pX-6){ hudX=SA.l+8; hudY=pB+6; }

  var tbY = (band>0 || PORTRAIT) ? hudB+ (PORTRAIT?26:24) : top0+12;
  tb.style.top=Math.round(tbY)+'px';

  if(PORTRAIT){ toast.style.top=Math.round(tbY+34)+'px'; toast.style.bottom='auto'; }
  else { toast.style.top='auto'; toast.style.bottom=Math.round(SA.b+14)+'px'; }
  var nb=document.getElementById('netban'); if(nb) nb.style.top=Math.round(tbY+(PORTRAIT?70:44))+'px';
  /* легенда геймпада — под паузой */

  var tbd=document.getElementById('tacbadge');

  tbd.style.right=Math.round(SA.r+PAD_R*3.5+6)+'px'; tbd.style.bottom=Math.round(SA.b+8)+'px';
  /* FPS: слева, где нет кнопок Telegram, табло и экранных кнопок */
  var fps=document.getElementById('fps');

  var nd=document.getElementById('netdbg'); if(nd){ nd.style.left=Math.round(SA.l+8)+'px'; nd.style.top=Math.round(Math.max(hudB+6, below+6))+'px'; }

function fitPadLabels(){
  var ids=['bA','bB','bX','bY','bRT'];
  for(var i=0;i<ids.length;i++){
    var b=document.getElementById(ids[i]); if(!b) continue;
    var l=b.querySelector('i'); if(!l) continue;
    var fs=Math.max(7, Math.min(9.5, PAD_R*0.22));
    l.style.fontSize=fs+'px';

    for(var k=0;k<8 && (l.scrollWidth>l.clientWidth+0.5 || l.offsetHeight>maxH) && fs>6;k++){ fs-=0.5; l.style.fontSize=fs+'px'; }

function rinkOutline(step){
  var r=CORNER, pts=[], i;
  function arc(cx,cz,a0,a1){
    var n=Math.max(3,Math.round(Math.abs(a1-a0)*r/step));
    for(i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; pts.push([cx+Math.cos(a)*r, cz+Math.sin(a)*r]); }
  }
  function line(x0,z0,x1,z1){
    var L=Math.hypot(x1-x0,z1-z0), n=Math.max(1,Math.round(L/step));
    for(var k=0;k<n;k++) pts.push([x0+(x1-x0)*k/n, z0+(z1-z0)*k/n]);
  }
  line(-(RL-r),-RW,(RL-r),-RW);
  arc(RL-r,-(RW-r),-Math.PI/2,0);
  line(RL,-(RW-r),RL,(RW-r));
  arc(RL-r, RW-r, 0, Math.PI/2);
  line((RL-r),RW,-(RL-r),RW);
  arc(-(RL-r), RW-r, Math.PI/2, Math.PI);
  line(-RL,(RW-r),-RL,-(RW-r));
  arc(-(RL-r),-(RW-r), Math.PI, Math.PI*1.5);
  return pts;
}

/* ============================================================
   ВВОД С ЭКРАНА — один обработчик на всё поле.

   Раньше кнопки слушали свои элементы, а джойстик — канву. На iOS,
   когда один палец уже держит канву и preventDefault отменил событие,
   touchstart второго пальца иногда доезжает до канвы, а не до кнопки —
   и нажатие терялось. Теперь все касания ловит один слушатель на #stage
   и сам решает, во что попал палец. Плюс запас вокруг кнопок и защёлка
   на один кадр, чтобы даже мгновенный тап не пропадал.
   ============================================================ */
var BTNS=[['bA','A'],['bB','B'],['bX','X'],['bY','Y'],['bRT','RTb'],['bPause','PAUSE']];
var btnEl={};
BTNS.forEach(function(b){ btnEl[b[0]]=document.getElementById(b[0]); });

var touchOwner={};   /* id касания -> 'stick' | ключ кнопки */

function btnAt(x,y){
  var best=null, bd=1e9;
  for(var i=0;i<BTNS.length;i++){
    var el=btnEl[BTNS[i][0]];
    if(!el) continue;
    var r=el.getBoundingClientRect();
    if(r.width<1) continue;
    var cx=r.left+r.width*0.5, cy=r.top+r.height*0.5;
    /* радиус кнопки плюс запас — попасть мимо на пару пикселей теперь не страшно */
    var rad=Math.max(r.width,r.height)*0.5 + Math.max(11, r.width*0.30);
    var d=Math.hypot(x-cx,y-cy);
    if(d<rad && d<bd){ bd=d; best=BTNS[i]; }
  }
  return best;
}
function setBtn(id,key,on){
  var el=btnEl[id];
  if(key==='PAUSE'){
    if(el) el.classList.toggle('press',on);
    if(on) togglePause();
    return;
  }
  IN[key]=on;
  if(on) TAP[key]=true;
  if(el) el.classList.toggle('press',on);
}

var uiIdle=0;                 /* секунд без касаний экрана */
function touchAwake(){
  uiIdle=0;
  if(_padDim){ _padDim=false; padFade(false); }
}
var _padDim=false;
function padFade(on){
  var pd=document.getElementById('pad'), st=document.getElementById('stick');
  if(pd) pd.classList.toggle('idle',on);
  if(st) st.classList.toggle('idle',on);
}
function inDown(id,x,y){
  audioInit();
  touchAwake();
  if(touchOwner[id]!==undefined) return;
  var b=btnAt(x,y);
  if(b){ touchOwner[id]=b; setBtn(b[0],b[1],true); return; }
  if(!stick.on && x < W*0.58){
    stick.on=true; stick.id=id; stick.ox=x; stick.oy=y; stick.x=x; stick.y=y;
    touchOwner[id]='stick';
  }
}
function inMove(id,x,y){
  if(touchOwner[id]!==undefined) uiIdle=0;   /* палец на экране — не гасим */
  if(touchOwner[id]!=='stick') return;
  var dx=x-stick.ox, dy=y-stick.oy, d=Math.hypot(dx,dy), m=Math.max(38,H*0.11);
  if(d>m){dx=dx/d*m; dy=dy/d*m;}
  stick.x=stick.ox+dx; stick.y=stick.oy+dy;
  stick.dx=dx/m; stick.dz=-dy/m;
}
function inUp(id){
  var o=touchOwner[id];
  if(o===undefined) return;
  delete touchOwner[id];
  if(o==='stick'){ stick.on=false; stick.id=null; stick.dx=0; stick.dz=0; return; }
  setBtn(o[0],o[1],false);
}
function releaseAll(){
  for(var k in touchOwner) inUp(k);
  stick.on=false; stick.dx=0; stick.dz=0;
  IN.A=IN.B=IN.X=IN.Y=IN.RTb=IN.LB=false;
  BTNS.forEach(function(b){ if(btnEl[b[0]]) btnEl[b[0]].classList.remove('press'); });
}

function tDown(e){

  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){

  }
}
function tMove(e){
  if(e.target.closest && e.target.closest('#start,#pausescr,#overscr')) return;
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i]; inMove(t.identifier,t.clientX,t.clientY);

}

function netTimeReset(){
  /* rAF был приостановлен на неизвестное время. last устарел — без
     сброса будет один кадр с клампованным dt (не страшно, и так
     ограничен 42мс), но netApply() посчитает span по огромному
     разрыву NET.bt-NET.at и может дать рывок экстраполяции в СТАРОМ
     (до-паузы) направлении. Обнуляем оба источника времени и
     схлопываем A=B, чтобы после паузы просто показать последнее
     известное состояние без угадывания — не дёргаться. */
  last=performance.now();
  if(NET.on){
    NET.at=NET.bt=performance.now();
    if(NET.b) NET.a=NET.b;
    /* после паузы вкладки буфер снимков устарел — оставляем последний */
    if(NETV.buf.length) NETV.buf=NETV.buf.slice(-1);
    NETV.offWin.length=0; NETV.jit.length=0; NETV.off=null;
  }
}

function readInput(){
  /* Раскладка ПК: движение стрелками, действия — левой рукой.
     Часть клавиш меняет смысл в зависимости от того, есть ли шайба,
     ровно как соответствующие кнопки геймпада. */
  var mx=0,mz=0;
  if(keys['ArrowLeft'])mx-=1;
  if(keys['ArrowRight'])mx+=1;
  if(keys['ArrowUp'])mz+=1;
  if(keys['ArrowDown'])mz-=1;
  var _me=HS[HUMAN]&&HS[HUMAN].ctrl, _hasP=!!(_me && puck.owner===_me);
  var kA  = !!keys['KeyE'] || (_hasP && !!keys['KeyS']),   /* пас · прессинг */
      kB  = _hasP && !!keys['KeyD'],                       /* бросок */
      kX  = !!keys['KeyA'] || (!_hasP && !!keys['KeyD']),  /* навес · силовой */
      kY  = !!keys['KeyW'],                                /* в разрез · вратарь */
      kRT = !!keys['KeyQ'],                                /* ускорение */
      kLB = !_hasP && !!keys['KeyS'];                      /* смена игрока */

  var gx=0,gz=0,gA=false,gB=false,gX=false,gY=false,gRT=false,gLB=false;
  var gST=false,gDU=false,gDD=false,gDL=false,gDR=false;
  if(navigator.getGamepads){
    var gps=navigator.getGamepads();
    for(var i=0;i<gps.length;i++){
      var gp=gps[i]; if(!gp||!gp.connected) continue;
      padConnected=true;
      var ax0=gp.axes[0]||0, ax1=gp.axes[1]||0;
      if(Math.abs(ax0)>0.18) gx=ax0;
      if(Math.abs(ax1)>0.18) gz=-ax1;
      var b=gp.buttons;
      function bp(n){ return b[n] && (b[n].pressed || b[n].value>0.4); }
      gA=bp(0); gB=bp(1); gX=bp(2); gY=bp(3);
      gLB=bp(4);
      gRT=bp(7)||bp(5);
      gST=bp(9);
      /* крестовина отвязана от движения — она переключает тактику */
      gDL=bp(14); gDR=bp(15); gDU=bp(12); gDD=bp(13);
      break;
    }
  }

  IN.mx = clamp(mx + stick.dx + gx, -1, 1);
  IN.mz = clamp(mz + stick.dz + gz, -1, 1);
  var L=Math.hypot(IN.mx,IN.mz); if(L>1){IN.mx/=L;IN.mz/=L;}

  var nA=IN.A||TAP.A||kA||gA, nB=IN.B||TAP.B||kB||gB,
      nX=IN.X||TAP.X||kX||gX, nY=IN.Y||TAP.Y||kY||gY;
  var nLB=IN.LB||TAP.LB||kLB||gLB;
  var nST=gST||!!keys['Escape'];
  var nDU=gDU||!!keys['Digit2'], nDD=gDD||!!keys['Digit3'],
      nDL=gDL||!!keys['Digit1'], nDR=gDR||!!keys['Digit1'];
  IN.RT = IN.RTb||TAP.RTb||kRT||gRT;

  /* Защёлка TAP.* означает «касание началось после прошлого кадра», поэтому она
     даёт фронт сама по себе. Без этого терялось нажатие, попавшее вместе с
     отпусканием предыдущего в один кадр: prevBtn ещё держал true, и фронта не
     возникало. На просадке кадров это и было «A не срабатывает с первого раза». */
  EDGE.A=(nA&&!prevBtn.A)||TAP.A; if(EDGE.A) _edgeA++; EDGE.B=(nB&&!prevBtn.B)||TAP.B;
  EDGE.X=(nX&&!prevBtn.X)||TAP.X; EDGE.Y=(nY&&!prevBtn.Y)||TAP.Y;
  EDGE.LB=(nLB&&!prevBtn.LB)||TAP.LB;
  EDGE.ST=nST&&!prevBtn.ST;
  EDGE.DU=nDU&&!prevBtn.DU; EDGE.DD=nDD&&!prevBtn.DD;
  EDGE.DL=nDL&&!prevBtn.DL; EDGE.DR=nDR&&!prevBtn.DR;
  IN._A=nA; IN._B=nB; IN._X=nX; IN._Y=nY; IN._LB=nLB;
  prevBtn.A=nA; prevBtn.B=nB; prevBtn.X=nX; prevBtn.Y=nY; prevBtn.LB=nLB;
  prevBtn.ST=nST; prevBtn.DU=nDU; prevBtn.DD=nDD; prevBtn.DL=nDL; prevBtn.DR=nDR;
  /* защёлки сняты — они отработали ровно один кадр */
  if(nA||nB||nX||nY) _tapSeen=true;
  TAP.A=false; TAP.B=false; TAP.X=false; TAP.Y=false; TAP.RTb=false; TAP.LB=false;

  /* тактика — только с геймпада/клавиатуры, с экрана менять нельзя */
  if(state==='play'||state==='face'){
    if(EDGE.DU) setTactic(HUMAN,1);
    else if(EDGE.DD) setTactic(HUMAN,2);
    else if(EDGE.DL||EDGE.DR) setTactic(HUMAN,0);
  }
  if(EDGE.ST && !MENU.layer()) togglePause();   /* в меню паузы Esc / Start обрабатывает меню */
}

/* Кто считает сетевой матч. netHost — этот клиент (хост в старой схеме): симуляция, снимки, ввод гостя.
   netFollow — матч считает другой: хост (мы гость) или сервер (NET.srv, оба игрока): снимки, предсказание. */
function netHost(){ return NET.on && !NET.srv && NET.role==='host'; }
function netFollow(){ return NET.on && (NET.srv || NET.role==='guest'); }
/* Сетевая диагностика (фаза 3.0, видна только с ?debug — панель #netdbg).
   Раз в секунду: пинг до Durable Object комнаты (png→pog, отвечает сам DO) и до соперника
   (pp→pq через релей); раз в 10 с — где живёт DO и откуда подключены игроки (dg→dgr).
   Статистика за последние 30 с: медиана, p90, джиттер (ст. отклонение). */
var NETDBG={sSent:0,sRecv:0,iSent:0,iRecv:0,tLast:0, sRate:0, iRate:0};
var NDG={pings:[],opp:[],n:0,diag:null,stOff:null};
function ndgPong(m){
  var now=performance.now(), r=now-m.k;
  NDG.pings.push([now,r]);
  if(m.st) NDG.stOff=Math.round(m.st-(Date.now()-r/2));      /* часы сервера минус наши */
}
function ndgOpp(m){ var now=performance.now(); NDG.opp.push([now, now-m.k]); }
function ndgDiag(d){ NDG.diag=d; }
function ndgStats(a){
  var now=performance.now();
  while(a.length && a[0][0]<now-30000) a.shift();
  if(!a.length) return null;
  var v=a.map(function(x){return x[1];}).sort(function(x,y){return x-y;});
  var mean=v.reduce(function(s,x){return s+x;},0)/v.length;
  var sd=Math.sqrt(v.reduce(function(s,x){return s+(x-mean)*(x-mean);},0)/v.length);
  return {med:Math.round(v[Math.floor(v.length/2)]), p90:Math.round(v[Math.floor(v.length*0.9)]), jit:Math.round(sd), n:v.length};
}
setInterval(function(){
  var now=performance.now();
  if(!NETDBG.tLast) NETDBG.tLast=now;
  var dt=Math.max(0.001,(now-NETDBG.tLast)/1000); NETDBG.tLast=now;
  NETDBG.sRate=(netHost()?NETDBG.sSent:NETDBG.sRecv)/dt; NETDBG.iRate=(netHost()?NETDBG.iRecv:NETDBG.iSent)/dt;
  NETDBG.sSent=0; NETDBG.sRecv=0; NETDBG.iSent=0; NETDBG.iRecv=0;
  if(!NET.on || !NET.ws || NET.ws.readyState!==1){
    var pe=document.getElementById('netdbg');
    if(pe && PERF.on && PERF.out){ pe.style.display='block'; pe.textContent=pfText(); }
    return;
  }
  NDG.n++;
  netSend({t:'png', n:NDG.n, k:now});
  if(NET.peer) netSend({t:'pp', k:now});
  if(NDG.n%10===1) netSend({t:'dg'});
  var el=document.getElementById('netdbg');
  if(!el) return;
  el.style.display='block';
  var d=NDG.diag, me=NET.role, pd=ndgStats(NDG.pings), po=ndgStats(NDG.opp);
  var mine=null, opp=null;
  if(d && d.conns) d.conns.forEach(function(c){ if(c.slot===me) mine=c; else opp=c; });
  var f=function(st){ return st ? 'med '+st.med+'  p90 '+st.p90+'  jit '+st.jit+' ms  (n='+st.n+')' : '—'; };
  var since=d && d.created ? new Date(d.created+(NDG.stOff?-NDG.stOff:0)).toTimeString().slice(0,8) : '—';
  el.textContent=
    'NET '+me+' · '+(NET.srv?'SERVER sim':'host sim')+' · peer '+(NET.peer?'yes':'no')+' · room '+NET.code+'\n'+
    'DO: '+(d?(d.doColo||'?')+' ('+(d.doLoc||'?')+') · hint '+(d.hint||'?')+' · up since '+since:'— (old Worker?)')+
    (d && d.sim ? ' · sim '+d.sim.steps+' steps, max '+d.sim.maxStepMs+' ms' : '')+'\n'+
    'me: '+(mine?mine.colo+' ('+mine.country+')':'—')+' · opp: '+(opp?opp.colo+' ('+opp.country+')':'—')+'\n'+
    'RTT→DO   '+f(pd)+'\n'+
    'RTT→opp  '+f(po)+'\n'+
    'snap '+NETDBG.sRate.toFixed(1)+'/s · input '+NETDBG.iRate.toFixed(1)+'/s · interp D '+Math.round(NETV.D*1000)+' ms · rtt(ack) '+Math.round(NETV.rtt||0)+' ms\n'+
    'server clock Δ '+(NDG.stOff===null?'—':(NDG.stOff>0?'+':'')+NDG.stOff+' ms')+
    (PERF.on && PERF.out ? '\n'+pfText() : '');
},1000);

/* ---------- client-side prediction (гость, только свой игрок) ----------
   PRED — предсказанное состояние (x,z,vx,vz,yaw,spd,stride,_back) своего
   персонажа, считается КАЖДЫЙ кадр локально из своего же ввода функциями
   humanMoveIntent/humanMoveIntegrate (теми же, что использует sim() на
   хосте — см. выше). PRED_LOG — история своего ввода с таймштампами, на
   случай доигрывания после коррекции. PRED_ERR — визуальная ошибка после
   коррекции, гасится плавно (не рывком), а не применяется мгновенно.
   Действия (пас/бросок/чек/поук) НЕ предсказываются — только движение:
   спекулятивно выполнять их локально означало бы дублировать игровые
   эффекты (шайба и т.п.), которые авторитетны только на хосте. */
var PRED=null, PRED_ERR={x:0,z:0,yaw:0}, PRED_LOG=[];
/* Сеть v2 (замеры: tools/smoke-lag.mjs).
   Ввод гостя: номер пакета q и счётчики нажатий c[A,B,X,Y,LB] — нажатие не теряется при
   склейке пакетов и не срабатывает дважды. Снимок хоста: подтверждение a (последний
   полученный q) и точные скорости управляемых игроков v — предсказание гостя доигрывает
   ровно те вводы, которых хост ещё не видел. Чужие игроки и шайба у гостя — из буфера
   снимков по времени хоста с задержкой D (интерполяция вместо «лесенки»). */
var SNAP_HZ=30, INPUT_HZ=30;
var NETV={q:0, cnt:[0,0,0,0,0], ack:0, sentT:{}, rtt:0,
          inQ:0, lastCnt:[0,0,0,0,0], tapB:false,
          buf:[], offWin:[], off:null, D:0.08, jit:[]};
var BTN_KEYS=['A','B','X','Y','LB'];
function predResetTo(p){
  PRED={p:p, x:p.x, z:p.z, vx:p.vx||0, vz:p.vz||0, yaw:p.yaw, spd:p.spd||0, stride:p.stride||0, _back:false};
  PRED_ERR.x=0; PRED_ERR.z=0; PRED_ERR.yaw=0;
}
function netPredictGuest(dt){
  if(!NET.b) return;
  var myP=HS[HUMAN].ctrl;
  if(!myP || myP.boxed || myP.down>0 || myP.goalie){ PRED=null; return; }
  if(!PRED || PRED.p!==myP) predResetTo(myP);
  if(state==='play'){
    var mi=humanMoveIntent(myP, HS[HUMAN], IN);
    humanMoveIntegrate(PRED, mi[0], mi[1], mi[2], mi[3], dt);
  }
  /* визуальная ошибка после последней коррекции гасится за ~120мс —
     это и есть требование "плавно, без рывка" */
  var decay=Math.min(1, dt/0.15);
  PRED_ERR.x-=PRED_ERR.x*decay; PRED_ERR.z-=PRED_ERR.z*decay; PRED_ERR.yaw-=PRED_ERR.yaw*decay;
  myP.x=PRED.x+PRED_ERR.x; myP.z=PRED.z+PRED_ERR.z;
  myP.yaw=PRED.yaw+PRED_ERR.yaw; myP.vx=PRED.vx; myP.vz=PRED.vz; myP.spd=PRED.spd; myP.stride=PRED.stride;
  myP._back=PRED._back;
}

   Здесь только клиентская часть: кто чем управляет (simCfg), камера и брызги после шага. */
var _edgeA=0;   /* сколько раз кнопка A дала фронт — для тестов ввода */
/* автопилот только в одиночной игре: в сетевом матче за игроком живой человек */

/* ввод → команды симуляции: игрок (или автопилот), у хоста — ещё гость; уровень ИИ соперника */
function simCfg(){
  var ap=autoPilot(), host=netHost(), o=1-HUMAN, c=SIM.control;
  c.first=HUMAN;
  c.tick[HUMAN]=true; c.hum[HUMAN]=!ap; c.inp[HUMAN]=ap?SIM.NOIN:IN; c.edge[HUMAN]=ap?SIM.NOEDGE:EDGE; c.rem[HUMAN]=null;
  c.tick[o]=host; c.hum[o]=host; c.inp[o]=NIN; c.edge[o]=NEDGE; c.rem[o]=host?NETV:null;
  /* соперник-компьютер получает уровень ?ai=, партнёры живого игрока — normal */

var spray=[];
function addSpray(p){
  spray.push({x:p.x,y:0.05,z:p.z,vx:-p.vx*0.13+rnd(-.5,.5),vy:rnd(0.5,1.6),vz:-p.vz*0.13+rnd(-.5,.5),
    life:rnd(0.22,0.5),max:0.5});
}

function sim(dt){
  simCfg();
  var r=SIM.step(dt);
  if(r>=1){
    controlled = HS[HUMAN].ctrl;
    chargeT    = HS[HUMAN].charge;
    PRESS      = HS[HUMAN].press;
    goalieCtl  = HS[HUMAN].goalieCtl;
  }
  if(r<2) return;
  camUpdate(dt);
  /* --- спрей --- */
  for(var s=spray.length-1;s>=0;s--){
    var sp2=spray[s];
    sp2.x+=sp2.vx*dt; sp2.y+=sp2.vy*dt; sp2.z+=sp2.vz*dt;
    sp2.vy-=5.2*dt; sp2.life-=dt;
    if(sp2.life<=0) spray.splice(s,1);
  }
}

function camUpdate(dt){
  if(CAMLOCK || MENU3D.on) return;

  // Determine focus target
  var carrier = puck.owner;
  var targetFocusX, targetFocusZ;
  var focusLerp = 5;  // default for carrier
  if(carrier){
    targetFocusX = carrier.x;
    targetFocusZ = carrier.z;
  } else {
    // Loose puck: focus on nearest HUMAN-team player to puck, not puck itself
    // This prevents camera chasing puck across entire rink
    var nearestDist = 1e9, nearestP = null;
    for(var i=0;i<players.length;i++){
      var p = players[i];
      if(p.team !== HUMAN || p.goalie || p.boxed) continue;
      var d = Math.hypot(p.x - puck.x, p.z - puck.z);
      if(d < nearestDist){ nearestDist = d; nearestP = p; }
    }
    if(nearestP){
      targetFocusX = nearestP.x;
      targetFocusZ = nearestP.z;
    } else {
      // Fallback: if no human players (edge case), use puck position
      targetFocusX = puck.x;
      targetFocusZ = puck.z;
    }
    focusLerp = 1.5;  // slower lerp for loose puck (0.6s to 95%)
  }

  // Focus = carrier position (clamped to rink with small margin)
  var FOCUS_MARGIN = 1.0;
  var focusTargetX = clamp(carrier ? carrier.x : targetFocusX, -RL + FOCUS_MARGIN, RL - FOCUS_MARGIN);
  var focusTargetZ = clamp(carrier ? carrier.z : targetFocusZ, -RW + FOCUS_MARGIN, RW - FOCUS_MARGIN);
  /* урок тренировки может держать в кадре нужное место (ворота — не под экранными кнопками справа) */
  if(TRAIN.on && TRAIN.L && TRAIN.L.cam){ var cf=TRAIN.L.cam(focusTargetX, focusTargetZ); focusTargetX=cf[0]; focusTargetZ=cf[1]; }

  // Smooth focus (gain 6 = ~0.4-0.5s, smooth on possession change/faceoff)
  cam.focusX = lerp(cam.focusX, focusTargetX, Math.min(1, dt * 6));
  cam.focusZ = lerp(cam.focusZ, focusTargetZ, Math.min(1, dt * 6));

  // SAFETY: Clamp focus
  if(!isFinite(cam.focusX) || !isFinite(cam.focusZ)){
    cam.focusX = isFinite(cam.focusX) ? cam.focusX : 0;
    cam.focusZ = isFinite(cam.focusZ) ? cam.focusZ : 0;
  }

  var CP = camPreset();
  var AD = attackDir(HUMAN);

  // Fixed distance — no dynamic spread calculation
  var dist = CP.d;

  // Compute target yaw - NO yaw lead in landscape (NHL broadcast: fixed yaw)
  var targetYaw = 0;
  if(PORTRAIT){
    // Portrait: fixed yaw based on attack direction
    targetYaw = AD > 0 ? Math.PI/2 : -Math.PI/2;
  }

  // Smooth yaw transition - cam.yaw is what toWorld() uses, so must be gradual
  cam.targetYaw = targetYaw;
  cam.yaw = lerp(cam.yaw, cam.targetYaw, Math.min(1, dt * 3));
  updYaw();

  // Smooth height and pitch
  cam.y = lerp(cam.y, CP.y, Math.min(1, dt * 3));
  cam.pitch = lerp(cam.pitch, CP.pitch, Math.min(1, dt * 3));

  // Position with fixed distance
  if(PORTRAIT){
    cam.x = lerp(cam.x, clamp(cam.focusX * CP.fx, -19, 19) - AD * dist, Math.min(1, dt * 3.4));
    cam.z = lerp(cam.z, clamp(cam.focusZ * CP.fz, -6, 6), Math.min(1, dt * 3.0));
  } else {
    // LANDSCAPE: state A — upper board works, attack offset, symmetric fz=0.85
    var MARGIN = 3.0;
    var standsXinner = RL + 2.2;
    var maxCamX = Math.min(27, standsXinner - MARGIN);

    var baseTargetX = cam.focusX * CP.fx;
    var ATTACK_OFFSET = 3.5;

    // Smoothed attack offset (prevents jerk on possession change)
    cam.attackOffsetX = (cam.attackOffsetX !== undefined ? cam.attackOffsetX : 0);
    var desiredAttackOffsetX = (carrier && carrier.team === HUMAN) ? AD * ATTACK_OFFSET : 0;
    cam.attackOffsetX = lerp(cam.attackOffsetX, desiredAttackOffsetX, Math.min(1, dt * 3.0));

    var targetX = baseTargetX + cam.attackOffsetX;
    targetX = clamp(targetX, -maxCamX, maxCamX);

    var FZ_BOARD = 0.85;
    var standsZinner = RW + 2.2;
    var safeZmin = -standsZinner + 0.5;  // -18.2: camera can reach near lower boards, not inside stands
    var safeZmax = standsZinner - MARGIN;    // 14.2 (unchanged upper)

    var targetZ = -dist + cam.focusZ * FZ_BOARD;
    targetZ = clamp(targetZ, safeZmin, safeZmax);

    cam.x = lerp(cam.x, targetX, Math.min(1, dt * 5.0));
    cam.z = lerp(cam.z, targetZ, Math.min(1, dt * 5.0));
  }

  if(cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 30);
}

function m4(){ return new Float32Array(16); }
function m4id(o){ o[0]=1;o[1]=0;o[2]=0;o[3]=0; o[4]=0;o[5]=1;o[6]=0;o[7]=0;
                  o[8]=0;o[9]=0;o[10]=1;o[11]=0; o[12]=0;o[13]=0;o[14]=0;o[15]=1; return o; }
function m4mul(o,a,b){
  var a00=a[0],a01=a[1],a02=a[2],a03=a[3], a10=a[4],a11=a[5],a12=a[6],a13=a[7],
      a20=a[8],a21=a[9],a22=a[10],a23=a[11], a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  for(var i=0;i<4;i++){
    var b0=b[i*4],b1=b[i*4+1],b2=b[i*4+2],b3=b[i*4+3];
    o[i*4]  =a00*b0+a10*b1+a20*b2+a30*b3;
    o[i*4+1]=a01*b0+a11*b1+a21*b2+a31*b3;
    o[i*4+2]=a02*b0+a12*b1+a22*b2+a32*b3;
    o[i*4+3]=a03*b0+a13*b1+a23*b2+a33*b3;
  }
  return o;
}
/* модель: поворот вокруг Y на yaw (как в старом pushMesh) + сдвиг */
function m4model(o,ox,oy,oz,yaw,k,ky){
  var c=Math.cos(yaw), s=Math.sin(yaw);
  if(k===undefined) k=1; if(ky===undefined) ky=k;
  o[0]=c*k;  o[1]=0;  o[2]=-s*k; o[3]=0;
  o[4]=0;    o[5]=ky; o[6]=0;    o[7]=0;
  o[8]=s*k;  o[9]=0;  o[10]=c*k; o[11]=0;
  o[12]=ox;  o[13]=oy;o[14]=oz;  o[15]=1;
  return o;
}

function buildView(o){
  var cy=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  var cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  /* строки матрицы поворота */
  var r00=cy,        r01=0,   r02=-sy;
  var r10=sp*sy,     r11=cp,  r12=sp*cy;
  var r20=-cp*sy,    r21=sp,  r22=-cp*cy;   /* GL смотрит в -Z */
  var tx=-(r00*cam.x+r01*cam.y+r02*cam.z);
  var ty=-(r10*cam.x+r11*cam.y+r12*cam.z);
  var tz=-(r20*cam.x+r21*cam.y+r22*cam.z);
  o[0]=r00; o[1]=r10; o[2]=r20; o[3]=0;
  o[4]=r01; o[5]=r11; o[6]=r21; o[7]=0;
  o[8]=r02; o[9]=r12; o[10]=r22;o[11]=0;
  o[12]=tx; o[13]=ty; o[14]=tz; o[15]=1;
  return o;
}
function buildProj(o,sx,sy){
  var n=1.0, f=220;
  o[0]=2*F/W; o[1]=0; o[2]=0; o[3]=0;
  o[4]=0; o[5]=2*F/H; o[6]=0; o[7]=0;
  o[8]=sx; o[9]=sy; o[10]=-(f+n)/(f-n); o[11]=-1;
  o[12]=0;o[13]=0;o[14]=-2*f*n/(f-n);o[15]=0;
  return o;
}

function glCompile(src,type){
  var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function glProgram(vs,fs){
  var p=gl.createProgram();
  gl.attachShader(p,glCompile(vs,gl.VERTEX_SHADER));
  gl.attachShader(p,glCompile(fs,gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p,0,'aPos'); gl.bindAttribLocation(p,1,'aNrm');
  gl.bindAttribLocation(p,2,'aCol'); gl.bindAttribLocation(p,3,'aUV');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* ---------- буферы ---------- */
function glBuild(d){
  /* d = {p:[],n:[],c:[],u:[]} */
  var n=d.p.length/3;
  var inter=new Float32Array(n*11);
  for(var i=0;i<n;i++){
    inter[i*11+0]=d.p[i*3]; inter[i*11+1]=d.p[i*3+1]; inter[i*11+2]=d.p[i*3+2];
    inter[i*11+3]=d.n[i*3]; inter[i*11+4]=d.n[i*3+1]; inter[i*11+5]=d.n[i*3+2];
    inter[i*11+6]=d.c?d.c[i*3]:1; inter[i*11+7]=d.c?d.c[i*3+1]:1; inter[i*11+8]=d.c?d.c[i*3+2]:1;
    inter[i*11+9]=d.u?d.u[i*2]:0; inter[i*11+10]=d.u?d.u[i*2+1]:0;
  }
  var vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  var vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bufferData(gl.ARRAY_BUFFER,inter,gl.STATIC_DRAW);
  var S=11*4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,S,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,S,12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,3,gl.FLOAT,false,S,24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,2,gl.FLOAT,false,S,36);
  gl.bindVertexArray(null);
  return {vao:vao, n:n};
}
function D(){ return {p:[],n:[],c:[],u:[]}; }
function tri(d,a,b,c,nx,ny,nz,col,ua,ub,uc){
  var V=[a,b,c], UV=[ua,ub,uc];
  for(var i=0;i<3;i++){
    d.p.push(V[i][0],V[i][1],V[i][2]);
    d.n.push(nx,ny,nz);
    d.c.push(col[0],col[1],col[2]);
    if(UV[i]) d.u.push(UV[i][0],UV[i][1]); else d.u.push(0,0);
  }
}
function quad(d,a,b,c,e,col,uv){
  var ux=uv||[[0,0],[1,0],[1,1],[0,1]];
  var e1=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], e2=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  var nx=e1[1]*e2[2]-e1[2]*e2[1], ny=e1[2]*e2[0]-e1[0]*e2[2], nz=e1[0]*e2[1]-e1[1]*e2[0];
  var L=Math.hypot(nx,ny,nz)||1; nx/=L;ny/=L;nz/=L;
  tri(d,a,b,c,nx,ny,nz,col,ux[0],ux[1],ux[2]);
  tri(d,a,c,e,nx,ny,nz,col,ux[0],ux[2],ux[3]);
}

/* ---------- труба по ломаной ---------- */
function tubePath(d, pts, r, col, seg){
  seg=seg||7;
  var rings=[], i,k;
  for(i=0;i<pts.length;i++){
    var p=pts[i];
    var t = (i<pts.length-1)
      ? [pts[i+1][0]-p[0], pts[i+1][1]-p[1], pts[i+1][2]-p[2]]
      : [p[0]-pts[i-1][0], p[1]-pts[i-1][1], p[2]-pts[i-1][2]];
    var tl=Math.hypot(t[0],t[1],t[2])||1; t=[t[0]/tl,t[1]/tl,t[2]/tl];
    var up = Math.abs(t[1])>0.9 ? [1,0,0] : [0,1,0];
    var a=[t[1]*up[2]-t[2]*up[1], t[2]*up[0]-t[0]*up[2], t[0]*up[1]-t[1]*up[0]];
    var al=Math.hypot(a[0],a[1],a[2])||1; a=[a[0]/al,a[1]/al,a[2]/al];
    var b=[t[1]*a[2]-t[2]*a[1], t[2]*a[0]-t[0]*a[2], t[0]*a[1]-t[1]*a[0]];
    var ring=[];
    for(k=0;k<seg;k++){
      var ang=k/seg*6.2831853;
      var ca=Math.cos(ang), sa=Math.sin(ang);
      ring.push([p[0]+(a[0]*ca+b[0]*sa)*r,
                 p[1]+(a[1]*ca+b[1]*sa)*r,
                 p[2]+(a[2]*ca+b[2]*sa)*r,
                 a[0]*ca+b[0]*sa, a[1]*ca+b[1]*sa, a[2]*ca+b[2]*sa]);
    }
    rings.push(ring);
  }
  for(i=0;i<rings.length-1;i++){
    for(k=0;k<seg;k++){
      var k2=(k+1)%seg;
      var A=rings[i][k], B=rings[i][k2], C=rings[i+1][k2], E=rings[i+1][k];
      /* нормали берём из кольца — трубе нужен гладкий бок */
      d.p.push(A[0],A[1],A[2], B[0],B[1],B[2], C[0],C[1],C[2]);
      d.n.push(A[3],A[4],A[5], B[3],B[4],B[5], C[3],C[4],C[5]);
      d.p.push(A[0],A[1],A[2], C[0],C[1],C[2], E[0],E[1],E[2]);
      d.n.push(A[3],A[4],A[5], C[3],C[4],C[5], E[3],E[4],E[5]);
      for(var q=0;q<6;q++){ d.c.push(col[0],col[1],col[2]); d.u.push(0,0); }
    }
  }
}
function arcPts(cx,cy,cz, r, a0,a1, n, plane){
  var out=[];
  for(var i=0;i<=n;i++){
    var a=a0+(a1-a0)*i/n, ca=Math.cos(a), sa=Math.sin(a);
    if(plane==='xz') out.push([cx+ca*r, cy, cz+sa*r]);
    else             out.push([cx+ca*r, cy+sa*r, cz]);
  }
  return out;
}

/* старый формат меша {v,f} -> треугольники */
function meshToGL(m){
  var d=D();
  for(var j=0;j<m.f.length;j++){
    var f=m.f[j], id=f.i, c=[f.c[0]/255,f.c[1]/255,f.c[2]/255], n=f.n;
    var v0=m.v[id[0]],v1=m.v[id[1]],v2=m.v[id[2]],v3=m.v[id[3]];
    tri(d,v0,v1,v2,n[0],n[1],n[2],c);
    tri(d,v0,v2,v3,n[0],n[1],n[2],c);
  }
  return glBuild(d);
}

  var r=CORNER+off, L=RL+off, Wd=RW+off, pts=[], i;
  var CORNER_SEGS = 16;  // fixed segments per 90° corner — guarantees equal point counts for all offsets
  function arc(cx,cz,a0,a1){
    var n = CORNER_SEGS;
    for(i=0;i<=n;i++){ var a=a0+(a1-a0)*i/n; pts.push([cx+Math.cos(a)*r, cz+Math.sin(a)*r]); }
  }
  function line(x0,z0,x1,z1){
    var Ln=Math.hypot(x1-x0,z1-z0), n=Math.max(1,Math.round(Ln/step));
    for(var k=0;k<n;k++) pts.push([x0+(x1-x0)*k/n, z0+(z1-z0)*k/n]);
  }
  line(-(L-r),-Wd,(L-r),-Wd);  arc(L-r,-(Wd-r),-Math.PI/2,0);
  line(L,-(Wd-r),L,(Wd-r));    arc(L-r, Wd-r, 0, Math.PI/2);
  line((L-r),Wd,-(L-r),Wd);    arc(-(L-r), Wd-r, Math.PI/2, Math.PI);
  line(-L,(Wd-r),-L,-(Wd-r));  arc(-(L-r),-(Wd-r), Math.PI, Math.PI*1.5);
  return pts;
}
function perim(pts){
  var s=0;
  for(var i=0;i<pts.length;i++){
    var a=pts[i], b=pts[(i+1)%pts.length];
    s+=Math.hypot(b[0]-a[0],b[1]-a[1]);
  }
  return s;
}

var TEXPX=34.13;   /* пикселей на метр в текстуре льда */

function buildIceTex(){
  var TW=QC().ice, TH=QC().ice/2, c=mkCanvas(TW,TH), g=c.getContext('2d');
  var S=TW/(2*RL);
  function X(x){ return (x+RL)*S; }
  function Z(z){ return (z+RW)*S; }
  function M(m){ return m*S; }

  var gr=g.createLinearGradient(0,0,0,TH);
  /* сама заливка льда чуть темнее: белый #f2f7fd выбивал в пересвет */
  gr.addColorStop(0,'#cbd9ea'); gr.addColorStop(0.45,'#e2eaf5'); gr.addColorStop(1,'#c9d8ea');
  g.fillStyle=gr; g.fillRect(0,0,TW,TH);

  /* лёгкая «полировка» */
  g.globalAlpha=0.05;
  for(var i=0;i<220;i++){
    g.fillStyle=i%2?'#ffffff':'#b9cee4';
    var yy=Math.random()*TH;
    g.fillRect(0,yy,TW,Math.random()*3+1);
  }
  g.globalAlpha=1;

  function vline(x,wm,col){ g.fillStyle=col; g.fillRect(X(x)-M(wm)/2,0,M(wm),TH); }
  function circle(cx,cz,r,wm,col){
    g.strokeStyle=col; g.lineWidth=M(wm);
    g.beginPath(); g.arc(X(cx),Z(cz),M(r),0,6.2832); g.stroke();
  }
  function dot(cx,cz,r,col){
    g.fillStyle=col; g.beginPath(); g.arc(X(cx),Z(cz),M(r),0,6.2832); g.fill();
  }

  /* линии */
  vline(0,0.30,'#d33a3a');
  vline( BLUE_X,0.30,'#2f5fc4'); vline(-BLUE_X,0.30,'#2f5fc4');
  vline( GOAL_X,0.09,'#d33a3a'); vline(-GOAL_X,0.09,'#d33a3a');

  /* центральный круг + точка */
  circle(0,0,4.5,0.09,'#2f5fc4'); dot(0,0,0.32,'#2f5fc4');

  /* круги вбрасывания в зонах */
  var FO=[[20,7],[20,-7],[-20,7],[-20,-7]];
  for(var k=0;k<FO.length;k++){
    circle(FO[k][0],FO[k][1],4.5,0.09,'#d33a3a');
    dot(FO[k][0],FO[k][1],0.32,'#d33a3a');
    /* «усы» */
    g.strokeStyle='#d33a3a'; g.lineWidth=M(0.09);
    var cx=FO[k][0], cz=FO[k][1];
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(s){
      g.beginPath();
      g.moveTo(X(cx+s[0]*0.6),Z(cz+s[1]*5.4)); g.lineTo(X(cx+s[0]*0.6),Z(cz+s[1]*6.3));
      g.moveTo(X(cx+s[0]*1.4),Z(cz+s[1]*5.4)); g.lineTo(X(cx+s[0]*1.4),Z(cz+s[1]*6.3));
      g.stroke();
    });
  }
  /* точки в средней зоне */
  dot(4.5,7,0.32,'#d33a3a'); dot(4.5,-7,0.32,'#d33a3a');
  dot(-4.5,7,0.32,'#d33a3a'); dot(-4.5,-7,0.32,'#d33a3a');

  /* площади ворот */
  [1,-1].forEach(function(dir){
    g.save();
    g.beginPath();
    if(dir>0) g.arc(X(GOAL_X),Z(0),M(1.8),Math.PI/2,Math.PI*1.5,false);
    else      g.arc(X(-GOAL_X),Z(0),M(1.8),-Math.PI/2,Math.PI/2,false);
    g.closePath();
    g.fillStyle='rgba(118,176,236,0.45)'; g.fill();
    g.strokeStyle='#d33a3a'; g.lineWidth=M(0.07); g.stroke();
    g.restore();
  });



  return c;
}

/* сетка ворот: белые нити на прозрачном */
function buildNetTex(){
  var S=256, c=mkCanvas(S,S), g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  g.strokeStyle='rgba(248,250,255,0.95)';
  g.lineWidth=2.2;
  var n=16, st=S/n;
  g.beginPath();
  for(var i=0;i<=n;i++){
    g.moveTo(i*st,0); g.lineTo(i*st,S);
    g.moveTo(0,i*st); g.lineTo(S,i*st);
  }
  g.stroke();
  /* узелки на пересечениях, чтобы сетка не выглядела чертёжной */
  g.fillStyle='rgba(248,250,255,0.9)';
  for(var y=0;y<=n;y++) for(var x=0;x<=n;x++){
    g.beginPath(); g.arc(x*st,y*st,1.9,0,6.283); g.fill();
  }
  return c;
}

function buildCrowdTex(){
  var TW=QC().crowd, TH=QC().crowd/2, c=mkCanvas(TW,TH), g=c.getContext('2d');
  var gr=g.createLinearGradient(0,0,0,TH);
  gr.addColorStop(0,'#0a0d12'); gr.addColorStop(0.5,'#141c28'); gr.addColorStop(1,'#1c2636');
  g.fillStyle=gr; g.fillRect(0,0,TW,TH);

  // Human silhouette colors
  var SKIN = ['#e8c5a0','#d4a57a','#c8966e','#b8855c'];          // 4 skin/hair tones
  var CLOTHES = ['#c83a3a','#3a7bc8','#d4b83a','#8a8a8a','#4aa84a','#5a3a7a']; // 6 clothing colors

  // True pseudo-random hash per seat — breaks diagonal pattern
  function seatHash(x, r){
    var h = (x * 374761393 + r * 668265263) >>> 0;
    h = (h ^ (h >>> 13)) * 1274126177 >>> 0;
    return (h ^ (h >>> 16)) >>> 0;
  }

  var rows=Math.round(34*TW/1024);
  for(var r=0;r<rows;r++){
    var y=TH-14-r*(TH/(rows+2));
    if(y<0) break;
    var stp=Math.max(6,Math.round(11*TW/1024));
    for(var x=-6;x<TW+6;x+=stp){
      var h = seatHash(x, r);
      var occ = h % 17;               // occupancy (was kk)
      if(occ < 7) continue;           // empty seat probability ~41%

      // Color indices from hash (no diagonal correlation)
      var skinIdx  = (h >>> 8) % SKIN.length;
      var clothIdx = (h >>> 16) % CLOTHES.length;

      // Brightness jitter ±15% from hash
      var bright = 0.85 + ((h >>> 24) / 0xFFFFFFFF) * 0.30;

      var px=x+((r%2)?stp*0.45:0);
      var pw=Math.max(3,Math.round(7*TW/1024));
      var ph=Math.max(4,Math.round(pw*1.6)); // body taller than wide
      var headR=Math.max(2,Math.round(pw*0.55));
      var headY=y - headR*0.3; // head slightly above body top
      var bodyY=y;
      var bodyX=px + Math.round((pw - Math.round(pw*0.7))/2);
      var bodyW=Math.max(2,Math.round(pw*0.7));

      // Apply brightness to clothing color
      var cloth = CLOTHES[clothIdx];
      var cr = parseInt(cloth.slice(1,3),16);
      var cg = parseInt(cloth.slice(3,5),16);
      var cb = parseInt(cloth.slice(5,7),16);
      var clothBright = 'rgb('+Math.round(cr*bright)+','+Math.round(cg*bright)+','+Math.round(cb*bright)+')';

      // Body (oval)
      g.fillStyle = clothBright;
      g.beginPath();
      g.ellipse(px + pw/2, bodyY + ph*0.55, bodyW/2, ph/2, 0, 0, 6.283);
      g.fill();

      // Head (oval) - slight brightness variation too
      var skin = SKIN[skinIdx];
      var sr = parseInt(skin.slice(1,3),16);
      var sg = parseInt(skin.slice(3,5),16);
      var sb = parseInt(skin.slice(5,7),16);
      var skinBright = 'rgb('+Math.round(sr*bright)+','+Math.round(sg*bright)+','+Math.round(sb*bright)+')';
      g.fillStyle = skinBright;
      g.beginPath();
      g.ellipse(px + pw/2, headY, headR, headR*0.85, 0, 0, 6.283);
      g.fill();

      // Shadow under seat (kept from original)
      g.fillStyle='rgba(0,0,0,0.45)';
      g.fillRect(px, y+ph, pw, Math.max(1,Math.round(pw*0.35)));
    }
  }
  /* горизонтальные проходы */
  g.fillStyle='rgba(0,0,0,0.5)';
  g.fillRect(0,TH*0.42,TW,7);
  return c;
}

function glTex(canvas,repeat,mip){
  var t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,canvas);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,repeat?gl.REPEAT:gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,repeat?gl.REPEAT:gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  if(mip!==false){
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
    var ax=gl.getExtension('EXT_texture_filter_anisotropic');
    if(ax) gl.texParameterf(gl.TEXTURE_2D,ax.TEXTURE_MAX_ANISOTROPY_EXT,
             Math.min(8,gl.getParameter(ax.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  } else {
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  }
  return t;
}
/* карта окружения: RGBM, равнопромежуточная, с мипами по шероховатости */
function glTexEnv(img){
  var t=gl.createTexture();

  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  return t;
}
function glTexImage(img){
  var t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);

  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  var ax=gl.getExtension('EXT_texture_filter_anisotropic');

           Math.min(8,gl.getParameter(ax.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));

function glTexUpdate(t,canvas){
  gl.bindTexture(gl.TEXTURE_2D,t);
