  var txt='';
  if(NET.rc) txt=T('rcSelf');
  else if(NET.on && NET.srv && netInMatch()){
    var ob=HUMAN===0?2:1, lb=HUMAN===0?8:4, w=NET.w||0;
    if(w&ob){ if(!(w&lb)) txt=T('rcOpp'); else if(performance.now()<(NET.goneT||0)) txt=T('oppGone'); }
  }
  if(el._t!==txt){ el._t=txt; if(txt) el.textContent=txt; el.style.opacity=txt?1:0; }
}

/* Серверный режим, запасной выход: хост отправил cfg, а сервер матч не начал (cfg обратно не пришёл за 4 с).
   Оба выходят из комнаты и входят заново уже в хост-схему (mode=host; режим пустой комнаты задаёт первый
   вошедший), матч начинает тот, кто оказался хостом. kind: 'go' — старт из меню, 'again' — реванш. */
var SRV_START_MS=4000;
function netSrvWatch(kind){
  clearTimeout(NET.srvT);
  NET.srvT=setTimeout(function(){ if(NET.on && NET.srv) netSrvFallback(kind, false); }, SRV_START_MS);
}
function netSrvFallback(kind, fromPeer){
  if(NET.noSrv) return;
  clearTimeout(NET.srvT);
  if(!fromPeer) netSend({t:'fb',k:kind});          /* сопернику (релей пересылает всё, чего не знает) */
  NET.noSrv=true; NET.fbTry=0; NET.fbKind=(kind==='again')?'again':'go';
  var url=NET.url, code=NET.code, old=NET.ws;
  NET.ws=null; NET.on=false; NET.peer=false;
  try{ if(old) old.close(); }catch(e){}
  netStatus(T('srvDown'));
  /* кто заметил — входит первым и становится хостом; второй — чуть позже */
  setTimeout(function(){ if(!NET.ws) netConnect(url, code, netFbStart); }, fromPeer?1500:500);
}
function netFbStart(){
  if(!NET.fbKind || !NET.on || NET.srv || NET.role!=='host' || !NET.peer) return;
  var k=NET.fbKind; NET.fbKind=null;
  if(k==='again' && state!=='menu') startMatchAgain();
  else goStart();
}

/* --- хост: снимок состояния --- */
function netSnap(){
  var d=[];
  d.push(r2(puck.x),r2(puck.y),r2(puck.z));
  d.push(score[0],score[1],Math.round(clock*10)/10,STC[state]||0);
  d.push(players.indexOf(HS[0].ctrl), players.indexOf(HS[1].ctrl));
  d.push(gkRush[0]?1:0, gkRush[1]?1:0);
  d.push(offWarn, penaltyLeft(0)|0, penaltyLeft(1)|0);
  d.push(r2(HS[0].aimX||0), r2(HS[0].aimZ||0), r2(HS[1].aimX||0), r2(HS[1].aimZ||0));
  var teamFlags=(HS[0].press.on?1:0)|(HS[1].press.on?2:0)|(HS[0].goalieCtl?4:0)|(HS[1].goalieCtl?8:0);
  d.push(players.indexOf(puck.owner), teamFlags);
  for(var i=0;i<players.length;i++){
    var p=players[i];
    d.push(r2(p.x),r2(p.z),r2(p.yaw),(p.down>0?1:0)+(p.boxed?2:0),r1(p.stride),r1(p.spd||0));
  }
  var c0=HS[0].ctrl, c1=HS[1].ctrl;
  var o={t:'s',d:d,k:Date.now(), a:NETV.inQ,
         v:[r2(c0?c0.vx:0),r2(c0?c0.vz:0),r2(c1?c1.vx:0),r2(c1?c1.vz:0)]};
  var ev=netTakeEvents(); if(ev) o.e=ev;
  netSend(o);
  NETDBG.sSent++; /* TEMP debug: see AskUserQuestion/report — remove after diagnosing guest lag */
}
function r2(v){ return Math.round(v*100)/100; }
function r1(v){ return Math.round(v*10)/10; }

/* --- гость: приём снимка --- */
function netRecvSnap(m){
  NET.a=NET.b; NET.at=NET.bt;
  NET.b=m.d;   NET.bt=performance.now();
  if(!NET.a){ NET.a=m.d; NET.at=NET.bt-60; }
  netBufPush(m);
  var replayFrom=Math.max(NET.at, NET.bt-300); /* client-side prediction:
    снэпшот, скорее всего, ещё не учитывает ввод, отправленный после
    ПРЕДЫДУЩЕГО снэпшота — от этой отметки и доигрываем накопленное (см.
    конец функции). Потолок 300мс — если предыдущий снэпшот пришёл давно
    (потерян пакет и т.п.), не переигрываем всё подряд без ограничения. */
  var d=m.d;
  score[0]=d[3]; score[1]=d[4]; clock=d[5];
  var ns=STN[d[6]]||'play';
  state=ns;
  /* события хоста (гол, бросок, свисток...) — звук, надписи и статистика у гостя */
  if(m.e) netRecvEvents(m.e);
  HS[0].ctrl=players[d[7]]||HS[0].ctrl;
  HS[1].ctrl=players[d[8]]||HS[1].ctrl;
  gkRush[0]=!!d[9]; gkRush[1]=!!d[10];
  offWarn=d[11];
  HS[0].aimX=d[14];
  HS[0].aimZ=d[15];
  HS[1].aimX=d[16];
  HS[1].aimZ=d[17];
  puck.owner=players[d[18]]||null;
  var tf=d[19]||0;
  HS[0].press.on=!!(tf&1);
  HS[1].press.on=!!(tf&2);
  HS[0].goalieCtl=!!(tf&4);
  HS[1].goalieCtl=!!(tf&8);
  /* sim() у гостя не бежит — controlled/PRESS/goalieCtl больше нигде
     не обновляются. controlled замораживался на игроке со старта
     матча; PRESS — хуже: это ссылка на объект, а reset() создаёт
     HS[0]=mkHS() заново, так что старая глобальная PRESS у гостя
     после первого же reset() указывала в никуда. Переприсваиваем
     все три из свежих HS[HUMAN]. */
  controlled = HS[HUMAN].ctrl;
  PRESS      = HS[HUMAN].press;
  goalieCtl  = HS[HUMAN].goalieCtl;
  document.getElementById('s1').textContent=score[0];
  document.getElementById('s2').textContent=score[1];

  /* client-side prediction: коррекция предсказанного движения СВОЕГО
     игрока по свежему авторитетному снэпшоту. Индекс своего игрока уже
     известен из d[7]/d[8] (HS[0]/HS[1].ctrl) — не нужно искать заново. */
  var myIdx=(HUMAN===0)?d[7]:d[8];
  if(myIdx>=0 && players[myIdx] && m.a!==undefined){
    var mo=20+myIdx*6;
    if(mo+5<d.length){
      var myP=players[myIdx];
      if(!PRED || PRED.p!==myP) predResetTo(myP);
      /* что сейчас видно на экране — от этого считаем ошибку ПОСЛЕ доигрывания */
      var visX=PRED.x+PRED_ERR.x, visZ=PRED.z+PRED_ERR.z, visYaw=PRED.yaw+PRED_ERR.yaw;
      PRED.x=d[mo]; PRED.z=d[mo+1]; PRED.yaw=d[mo+2]; PRED.spd=d[mo+5];
      var vv=m.v, vi=(HUMAN===0)?0:2;
      if(vv){ PRED.vx=vv[vi]; PRED.vz=vv[vi+1]; }
      else { PRED.vx=Math.cos(PRED.yaw)*PRED.spd; PRED.vz=Math.sin(PRED.yaw)*PRED.spd; }
      /* доигрываем все вводы, которых хост ещё не видел (q > a), шагами как у хоста */
      var nowT=performance.now();
      while(PRED_LOG.length && PRED_LOG[0].q<=m.a) PRED_LOG.shift();
      for(var ri=0; ri<PRED_LOG.length; ri++){
        var e=PRED_LOG[ri], tEnd=(ri+1<PRED_LOG.length)?PRED_LOG[ri+1].t:nowT;
        var rem=Math.min(0.25,(tEnd-e.t)/1000);
        while(rem>1e-4){
          var h=Math.min(1/60,rem); rem-=h;
          var mi2=humanMoveIntent(myP, HS[HUMAN], e);
          humanMoveIntegrate(PRED, mi2[0], mi2[1], mi2[2], mi2[3], h);
        }
      }
      /* экран остаётся на месте, разница гасится плавно в netPredictGuest;
         большая разница — это телепорт (вбрасывание, штраф): принимаем сразу */
      PRED_ERR.x=visX-PRED.x; PRED_ERR.z=visZ-PRED.z;
      /* и поворот: иначе конец клюшки (и шайба на нём) дёргается на каждом снимке */
      var dyw=visYaw-PRED.yaw; while(dyw>Math.PI) dyw-=Math.PI*2; while(dyw<-Math.PI) dyw+=Math.PI*2;
      PRED_ERR.yaw=dyw;
      if(Math.hypot(PRED_ERR.x,PRED_ERR.z)>3){ PRED_ERR.x=0; PRED_ERR.z=0; PRED_ERR.yaw=0; }
    }
  }
}
/* буфер снимков у гостя: время хоста k, оценка сдвига часов (минимальная задержка за 3 с),
   адаптивная задержка отрисовки D = интервал снимков + p90 джиттера */
function netBufPush(m){
  var now=Date.now(), k=m.k||now;
  var B=NETV.buf;
  if(B.length && k<=B[B.length-1].t) return;           /* повтор / старьё */
  B.push({t:k, d:m.d});
  while(B.length>2 && B[1].t < k-1500) B.shift();
  var o=now-k;                                          /* задержка + разница часов */
  NETV.offWin.push(o); if(NETV.offWin.length>90) NETV.offWin.shift();
  var mn=Infinity; for(var i=0;i<NETV.offWin.length;i++) if(NETV.offWin[i]<mn) mn=NETV.offWin[i];
  NETV.off=mn;
  NETV.jit.push(o-mn); if(NETV.jit.length>90) NETV.jit.shift();
  var js=NETV.jit.slice().sort(function(a,b){return a-b;});
  var p90=js[Math.floor(js.length*0.9)]||0;
  var target=clamp(1000/SNAP_HZ*1.2 + p90, 45, 250)/1000;
  NETV.D += (target-NETV.D)*(target>NETV.D?0.3:0.05);  /* растёт быстро, уменьшается плавно */
  if(m.a!==undefined){ NETV.ack=m.a; var st=NETV.sentT[m.a];
    if(st){ var r=performance.now()-st; NETV.rtt = NETV.rtt ? NETV.rtt*0.9+r*0.1 : r; }
    for(var q in NETV.sentT) if(+q<=m.a) delete NETV.sentT[q]; }
}
function _lerpAng(a,b,k){ var d=b-a; while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; return a+d*k; }
function netApply(){
  var Bf=NETV.buf; if(!Bf.length) return;
  /* момент на часах хоста, который показываем */
  var rt = (NETV.off!==null) ? Date.now()-NETV.off-NETV.D*1000 : Bf[Bf.length-1].t;
  var i1=Bf.length-1;
  while(i1>0 && Bf[i1-1].t>=rt) i1--;
  var S1=Bf[i1], S0=Bf[Math.max(0,i1-1)], k;
  if(S1.t<=rt){                                         /* новее нет: чуть экстраполируем, не больше 100 мс */
    S0=Bf[Math.max(0,Bf.length-2)]; S1=Bf[Bf.length-1];
    var span=Math.max(1,S1.t-S0.t);
    k=1+Math.min(rt-S1.t,100)/span;
  } else {
    var sp=Math.max(1,S1.t-S0.t); k=clamp((rt-S0.t)/sp,0,1);
  }
  var A=S0.d, B=S1.d, base=20;
  for(var i=0;i<players.length;i++){
    var o=base+i*6;
    if(o+5>=B.length) break;
    var p=players[i];
    var ax=A[o]!==undefined?A[o]:B[o], az=A[o+1]!==undefined?A[o+1]:B[o+1];
    if(Math.hypot(B[o]-ax,B[o+1]-az)>3){ p.x=B[o]; p.z=B[o+1]; }      /* телепорт — без «проезда» через поле */
    else { p.x=ax+(B[o]-ax)*k; p.z=az+(B[o+1]-az)*k; }
    p.yaw=_lerpAng(A[o+2]!==undefined?A[o+2]:B[o+2], B[o+2], Math.min(k,1));
    var fl=B[o+3];
    p.down=(fl&1)?1:0; p.boxed=(fl&2)?1:0;
    p.stride=B[o+4];
    p.spd=B[o+5];
  }
  if(Math.hypot(B[0]-A[0],B[2]-A[2])>4){ AUTHPK.x=B[0]; AUTHPK.z=B[2]; }
  else { AUTHPK.x=A[0]+(B[0]-A[0])*k; AUTHPK.z=A[2]+(B[2]-A[2])*k; }
  AUTHPK.y=A[1]+(B[1]-A[1])*Math.min(k,1);
  var sdt=Math.max(1,S1.t-S0.t)/1000; AUTHPK.vx=(B[0]-A[0])/sdt; AUTHPK.vz=(B[2]-A[2])/sdt;
  if(!(PUCKP && PUCKP.on)){ puck.x=AUTHPK.x; puck.z=AUTHPK.z; puck.y=AUTHPK.y; }
}
var AUTHPK={x:0,y:0.05,z:0,vx:0,vz:0};   /* шайба по снимкам хоста (интерполированная) */

/* ============================================================
   ГОСТЬ: ПРЕДСКАЗАНИЕ ДЕЙСТВИЙ И ШАЙБЫ
   Пас/бросок/подбор гостя видны у него сразу: анимация, звук, вылет шайбы по той же
   физике. Хост остаётся судьёй: когда шайба у хоста кем-то поймана, отскочила или
   прошло время — картинка плавно переходит на его данные; если хост действие не
   принял (шайба у него всё ещё у гостя), шайба плавно возвращается.
   ============================================================ */
var PUCKP=null;                    /* {on, mode:'held'|'fly'|'blend', t0, x,y,z, vx,vy,vz, w} */
var GACT={chg:0, pred:null, pickT:0, looseT:0};
function stickEnd(p){ return [p.x+Math.cos(p.yaw)*0.95, p.z+Math.sin(p.yaw)*0.95]; }
function puckStep(P,dt){           /* та же физика шайбы, что в sim (без штанг и ворот) */
  P.x+=P.vx*dt; P.z+=P.vz*dt; P.y+=P.vy*dt; P.vy-=13*dt;
  if(P.y<0.05){ P.y=0.05; P.vy=(Math.abs(P.vy)>1.4)? -P.vy*0.32:0; }
  var fr=Math.pow(0.996, dt*60); P.vx*=fr; P.vz*=fr;
  if(P.z<-RW+0.35){P.z=-RW+0.35;P.vz=-P.vz*0.72;} if(P.z>RW-0.35){P.z=RW-0.35;P.vz=-P.vz*0.72;}
  if(P.x<-RL+0.35){P.x=-RL+0.35;P.vx=-P.vx*0.72;} if(P.x>RL-0.35){P.x=RL-0.35;P.vx=-P.vx*0.72;}
  var hw=halfWidthAt(P.x)-0.35; if(Math.abs(P.z)>hw && hw>0){ P.z=Math.sign(P.z)*hw; P.vz=-P.vz*0.72; }
}
function launchPred(kind, arg, me){
  var from=stickEnd(me), vx, vz, vy=0, now=performance.now();
  if(kind==='pass'){
    var cfg={A:[19,false,false], Y:[21,false,true], X:[15,true,false]}[arg];
    var pa=passAim(me,cfg[2],null,null), dx=pa.tx-from[0], dz=pa.tz-from[1], L=Math.hypot(dx,dz)||1;
    var pv=pa.v||cfg[0];               /* в разрез сила своя — под рывок партнёра (sim passAim) */
    vx=dx/L*pv; vz=dz/L*pv; vy=cfg[1]?3.2:0;

  } else {
    var sa=shotAim(me), dx2=sa.tx-from[0], dz2=sa.tz-from[1], L2=Math.hypot(dx2,dz2)||1, sp=17+arg*17;

/* сводка к снимкам: дольше при большом расхождении (0.15…0.3 с), чтобы не было рывка */
function puckBlend(){ if(PUCKP){ PUCKP.mode='blend'; PUCKP.w=0;
  PUCKP.bt=clamp(Math.hypot((PUCKP.x||0)-AUTHPK.x,(PUCKP.z||0)-AUTHPK.z)/20, 0.15, 0.3); } }
/* предсказанный полёт не знает вратаря, ворот и клюшек: у ворот соперника и рядом с чужим игроком
   исход решает сервер — там шайба не пролетает насквозь, а тормозит и ждёт снимков */
function puckContested(P, me){
  var gx=attackDir(HUMAN)*GOAL_X;
  if((P.x-gx)*Math.sign(gx) > -3 && Math.abs(P.z) < 4.5) return true;
  for(var i=0;i<players.length;i++){ var o=players[i];
    if(o!==me && !o.boxed && Math.hypot(o.x-P.x, o.z-P.z) < 1.4) return true; }
  return false;
}
function puckBlendStep(dt, auth, me){
  PUCKP.w=Math.min(1, PUCKP.w+dt/(PUCKP.bt||0.15));
  var w=PUCKP.w*PUCKP.w*(3-2*PUCKP.w);
  var tx=AUTHPK.x, tz=AUTHPK.z;
  if(auth===me && me){ var s2=stickEnd(me); tx=s2[0]; tz=s2[1]; }
  puck.x=PUCKP.x+(tx-PUCKP.x)*w; puck.z=PUCKP.z+(tz-PUCKP.z)*w; puck.y=PUCKP.y+(AUTHPK.y-PUCKP.y)*w;

}
function netGuestActions(dt){
  var me=HS[HUMAN].ctrl, now=performance.now();

    /* гол / свисток, пока шайба летела по предсказанию: к снимкам — плавно, а не скачком */
    if(PUCKP && PUCKP.on && PUCKP.mode!=='held'){ if(PUCKP.mode!=='blend') puckBlend(); puckBlendStep(dt, null, null); }
    else if(PUCKP) PUCKP.on=false;
    return; }
  var lagMs=(NETV.rtt||120)+NETV.D*1000+300;
  var auth=puck.owner;                                   /* владелец по последнему снимку */
  if(auth) GACT.looseT=0; else if(!GACT.looseT) GACT.looseT=now;
  var held = auth===me || (PUCKP && PUCKP.on && PUCKP.mode==='held');
  /* подбор: клюшка своего (предсказанного) игрока дотянулась до ничьей шайбы */
  /* шайба на экране отстаёт от снимков на D: пока она ничья меньше D+50 мс, нарисованная
     позиция ещё старая (например, на своей же клюшке после отбора) — такой «подбор» ложный */
  if(!held && !auth && !(PUCKP && PUCKP.on) && !(me.down>0) && now-GACT.looseT>NETV.D*1000+50){
    var se=stickEnd(me);
    if(Math.hypot(se[0]-AUTHPK.x, se[1]-AUTHPK.z)<0.85 && AUTHPK.y<0.85){

    }
  }

  if(held && !(PUCKP && PUCKP.on && PUCKP.mode!=='held')){
    var pk = EDGE.A?'A':(EDGE.Y?'Y':(EDGE.X?'X':null));
    if(pk){ launchPred('pass', pk, me); GACT.chg=0; }
    else if(IN._B) GACT.chg=Math.min(0.85, GACT.chg+dt);
    else if(GACT.chg>0 || EDGE.B){ launchPred('shot', clamp(Math.max(GACT.chg,1/60)/0.85,0.18,1), me); GACT.chg=0; }
  } else if(!IN._B) GACT.chg=0;

  /* шайба на экране */
  if(PUCKP && PUCKP.on){
    var age=now-PUCKP.t0;

      if(auth===me) PUCKP.on=false;                                  /* хост подтвердил */
      else if((auth && auth!==me) || age>lagMs){ var s0=stickEnd(me); PUCKP.x=s0[0]; PUCKP.z=s0[1]; PUCKP.y=0.05; PUCKP.vx=PUCKP.vz=PUCKP.vy=0; puckBlend(); }
      else { var s1=stickEnd(me); puck.x=s1[0]; puck.z=s1[1]; puck.y=0.05; }

      if((!hostReleased && age>lagMs) || (auth && auth!==me && age>(NETV.rtt||120)*0.5) || diverged || age>1400) puckBlend();
      /* дальше предсказанию не верим: у ворот / чужого игрока, или сервер уже должен был подтвердить бросок */
      else if(puckContested(PUCKP, me) || (!hostReleased && age>(NETV.rtt||120)+NETV.D*1000+100)) PUCKP.mode='wait';
      else { puck.x=PUCKP.x; puck.z=PUCKP.z; puck.y=PUCKP.y; }
    }
    if(PUCKP.on && PUCKP.mode==='wait'){
      /* тормозит (≈0.1 с до остановки), пока снимки сервера не догонят: тогда сводка к ним */
      var fr=Math.exp(-dt/0.1); PUCKP.vx*=fr; PUCKP.vz*=fr; PUCKP.vy*=fr;
      puckStep(PUCKP, dt);
      var hr=auth!==me, caught=hr && (Math.hypot(PUCKP.x-AUTHPK.x, PUCKP.z-AUTHPK.z)<1.2 || age>(NETV.rtt||120)+NETV.D*1000+150);
      if(caught || (auth && auth!==me) || (!hr && age>lagMs) || age>1400) puckBlend();
      else { puck.x=PUCKP.x; puck.z=PUCKP.z; puck.y=PUCKP.y; }
    }
    if(PUCKP.on && PUCKP.mode==='blend') puckBlendStep(dt, auth, me);
  }
  /* шайба своего игрока — на его (предсказанной) клюшке, а не позади на длину пинга */
  if(!(PUCKP && PUCKP.on) && auth===me){ var s3=stickEnd(me); puck.x=s3[0]; puck.z=s3[1]; puck.y=0.05; }

/* Шайба у гостя рисуется из разных источников: своя (предсказанная) клюшка, снимки хоста,
   предсказание. Переход «моя клюшка ↔ снимки хоста» (у меня отобрали / мне отдали пас)
   давал скачок на длину пинга — сводим его за ~140 мс. Вылет при своём пасе/броске
   (предсказание) не трогаем: он должен быть мгновенным. */
var PDS={mode:null, bl:0, fx:0, fz:0, lx:0, lz:0};
function puckSourceBlend(dt, mode){
  var tx=puck.x, tz=puck.z;
  if(PDS.mode && mode!==PDS.mode && mode!=='pred' && PDS.mode!=='pred'){
    var j=Math.hypot(tx-PDS.lx, tz-PDS.lz);
    if(j>0.2 && j<4){ PDS.bl=1; PDS.fx=PDS.lx; PDS.fz=PDS.lz; }
  }
  if(PDS.bl>0){
    PDS.bl=Math.max(0, PDS.bl-dt/0.14);
    var w=PDS.bl*PDS.bl*(3-2*PDS.bl);             /* вес старой точки */
    puck.x=tx+(PDS.fx-tx)*w; puck.z=tz+(PDS.fz-tz)*w;

/* звук/анимация от события хоста: своё предсказанное действие уже озвучено и сыграно */
function predictedOwn(e, kind){

  var me=HS[HUMAN].ctrl; if(!me || players.indexOf(me)!==e.p) return false;
  if(performance.now()-GACT.pred.t>2500) return false;

/* --- гость: отправка ввода --- */
function netSendInput(){
  var b=(IN._A?1:0)|(IN._B?2:0)|(IN._X?4:0)|(IN._Y?8:0)|(IN.RT?16:0)|(IN._LB?32:0);
  var q=++NETV.q;
  /* серверу — стик уже в мировых координатах (у него нет камеры); хосту — как раньше, экранный */
  var sm=IN.mx, sz=IN.mz;
  if(NET.srv){ var wv=toWorld(IN.mx,IN.mz,[0,0]); sm=wv[0]; sz=wv[1]; }
  netSend({t:'i',m:[r2(sm),r2(sz)],b:b,tc:TACTIC[HUMAN],q:q,c:NETV.cnt.slice()});
  NETV.sentT[q]=performance.now();

  /* client-side prediction: история своего ввода для доигрывания после

  var nowT=performance.now();

function netRecvInput(m){

  NIN._A=!!(b&1); NIN._B=!!(b&2); NIN._X=!!(b&4);
  NIN._Y=!!(b&8); NIN.RT=!!(b&16); NIN._LB=!!(b&32);

       сбрасывается после того, как humanTick его использовал — склейка пакетов его не

}

function updateFxOnly(dt){

    var sp2=spray[s2];
    sp2.x+=sp2.vx*dt; sp2.y+=sp2.vy*dt; sp2.z+=sp2.vz*dt;
    sp2.vy-=5.2*dt; sp2.life-=dt;

var _glT=performance.now();

/* Кадр разделён на две части: frame — привязка к requestAnimationFrame и
   реальному времени, frameStep(dt) — всё остальное. Так отладка может
   заморозить игру (__hk.freeze) и прогнать ровно N кадров по 1/60 с
   (__hk.step) синхронно, без ожидания браузера. */
function frame(now){
  var raw=now-last;
  if(raw>0 && raw<250) RT.ms = RT.ms>0 ? RT.ms*0.9+raw*0.1 : raw;    /* реальное время кадра (вкладка в фоне — пропуск) */
  if(PERF.on && raw>0 && raw<250){ PERF.iv+=raw; PERF.ivN++; }

var _uiMenu=null, _uiPad=null;
function pfSum(){ var s=0; for(var i=0;i<PERF_KEYS.length;i++) s+=PERF.acc[PERF_KEYS[i]]||0; return s; }

  } else h2.style.opacity=0;

  /* предупреждение об офсайде */
  var chip=document.getElementById('chip');

    chip.style.background='rgba(210,140,30,0.92)'; chip.style.color='#1d1305'; chip.style.opacity=1; }
  else chip.style.opacity=0;

  /* скорость активного игрока */
  if(controlled) document.getElementById('spd').textContent=Math.round(controlled.spd*3.6)+' '+T('kmh');
}

/* профиль игрока: статистика из match:summary (пока локально; позже — сервер, docs/EVENTS.md).
   localStorage + кэш в CloudStorage ('profile'): из двух копий берётся та, где больше матчей */
var PROF={m:0, w:0, d:0, l:0, g:0, ga:0, streak:0, best:0, online:0};
function profApply(v){
  var o=null; try{ o=JSON.parse(v); }catch(e){}
  if(!o || typeof o.m!=='number' || o.m<PROF.m) return false;
  for(var k in PROF) if(typeof o[k]==='number' && o[k]>=0) PROF[k]=Math.floor(o[k]);
  return true;
}
prefGet('profile', function(v){ if(v && profApply(v) && MENU.ready) MENU.repaint(); });
EV.on('match:summary', function(s){
  if(!s || !s.score) return;
  var me=s.team|0;
  PROF.m++;
  if(s.result==='win'){ PROF.w++; PROF.streak++; if(PROF.streak>PROF.best) PROF.best=PROF.streak; }
  else { if(s.result==='draw') PROF.d++; else PROF.l++; PROF.streak=0; }
  PROF.g+=s.score[me]|0; PROF.ga+=s.score[1-me]|0;
  if(s.mode==='online') PROF.online++;
  prefSet('profile', JSON.stringify(PROF));
  if(MENU.ready){ MENU.build('main'); MENU.build('profile'); }
});

MENU.tick=function(dt){
  var L=MENU.layer();
  if(L!==MENU.lastL){ MENU.lastL=L; MENU.padFresh=true; if(L) MENU.onLayer(L); }
  MENU.syncBack();
  var P={}, gp=null;
  if(navigator.getGamepads){ var gs=navigator.getGamepads(); for(var i=0;i<gs.length;i++) if(gs[i] && gs[i].connected){ gp=gs[i]; break; } }
  if(gp){
    var b=gp.buttons, ax=gp.axes||[];
    var bp=function(n){ return !!(b[n] && (b[n].pressed || b[n].value>0.5)); };
    P.u=bp(12)||(ax[1]||0)<-0.6; P.d=bp(13)||(ax[1]||0)>0.6; P.l=bp(14)||(ax[0]||0)<-0.6; P.r=bp(15)||(ax[0]||0)>0.6;
    P.a=bp(0); P.b=bp(1); P.st=bp(9); P.lb=bp(4); P.rb=bp(5);
  }
  var pr=MENU.pad; MENU.pad=P;
  if(!L){ MENU.rep.k=null; return; }
  if(MENU.padFresh){ MENU.padFresh=false; MENU.rep.k=(P.u?'u':P.d?'d':P.l?'l':P.r?'r':null); MENU.rep.t=1e9; return; }
  var ed=function(k){ return P[k] && !pr[k]; };
  var dir=P.u?'u':(P.d?'d':(P.l?'l':(P.r?'r':null)));
  var fire=function(k){ MENU.setVia('pad'); if(k==='u') MENU.move(-1); else if(k==='d') MENU.move(1); else MENU.adj(k==='l'?-1:1); };
  if(dir){
    if(dir!==MENU.rep.k){ MENU.rep.k=dir; MENU.rep.t=0.38; fire(dir); }
    else { MENU.rep.t-=dt; if(MENU.rep.t<=0){ MENU.rep.t=0.12; fire(dir); } }
  } else MENU.rep.k=null;
  if(ed('a')){ MENU.setVia('pad'); MENU.activate(); }
  else if(ed('b')){ MENU.setVia('pad'); MENU.back(); }
  else if(ed('st')){ if(L==='pause' || MENU.stack[0]==='@pause') setPaused(false); }
  else if(ed('lb')){ MENU.setVia('pad'); MENU.tabs(-1); }
  else if(ed('rb')){ MENU.setVia('pad'); MENU.tabs(1); }
};

/* ---------- ввод меню: клавиатура и касание ---------- */
window.addEventListener('keydown', function(e){
  var L=MENU.layer();
  if(!L){
    /* Esc в матче — пауза сразу, не дожидаясь кадра (короткое нажатие иначе теряется между кадрами) */
    if(e.code==='Escape' && !e.repeat && state!=='menu' && state!=='over' && !PORTRAIT){ keys.Escape=false; e.preventDefault(); MENU.setVia('key'); togglePause(); }
    return;
  }
  var k=e.code, tg=e.target;
  if(tg && tg.tagName==='INPUT'){
    if(k==='Escape'){ tg.blur(); e.preventDefault(); }
    else if(k==='Enter' || k==='NumpadEnter'){ tg.blur(); e.preventDefault(); if(tg.id==='rcode') netJoin(); }
    keys[k]=false; return;
  }
  var used=true;
  if(k==='ArrowUp') MENU.move(-1);
  else if(k==='ArrowDown') MENU.move(1);
  else if(k==='ArrowLeft') MENU.adj(-1);
  else if(k==='ArrowRight') MENU.adj(1);
  else if(k==='Enter' || k==='NumpadEnter' || k==='Space'){ if(!e.repeat) MENU.activate(); }
  else if(k==='Escape' || k==='Backspace'){ if(!e.repeat) MENU.back(); }
  else if(k==='KeyQ' || k==='PageUp') MENU.tabs(-1);
  else if(k==='KeyE' || k==='PageDown') MENU.tabs(1);
  else used=false;
  if(used){ e.preventDefault(); keys[k]=false; MENU.setVia('key'); }
});

/* ---------- музыка меню ----------
   Треки — assets/dist/music-*.m4a (tools/pack-assets.mjs), по одному, вперемешку без повтора подряд. Играет в меню и на
   экране поворота, в матче затихает за 0.8 с. На iPhone звук включается только касанием: не разрешили — подсказка
   «коснись для звука», музыка стартует с первого касания. Громкость — через WebAudio (на iPhone <audio>.volume не
   работает), до первого касания — через <audio>.volume. */
var MUSIC={el:null, list:[], order:[], i:-1, name:'', cur:0, blocked:false, pending:false, routed:false, gain:null, off:true};
MUSIC.init=function(){
  var L=(window.ASSETS && ASSETS.music) || [];
  if(!L.length || TEST.autostart || TEST.frozen || /[?&]nomusic\b/.test(location.search)) { MUSIC.paint(); return; }
  MUSIC.off=false; MUSIC.list=L;
  var el=new Audio(); el.preload='auto'; MUSIC.el=el;
  el.addEventListener('ended', function(){ MUSIC.next(); });
  el.addEventListener('error', function(){ if(MUSIC.list.length>1) setTimeout(function(){ MUSIC.next(); }, 1500); });
  MUSIC.paint();
  /* трек качается после моделей игроков: на медленной сети они нужнее (без них не начать матч) */
  playersReady(function(){ MUSIC.next(); });
};
MUSIC.next=function(){
  var n=MUSIC.list.length;
  if(++MUSIC.i>=MUSIC.order.length){
    var last=MUSIC.order[MUSIC.order.length-1], o=[];
    for(var k=0;k<n;k++) o.push(k);
    for(var j=n-1;j>0;j--){ var r=Math.floor(Math.random()*(j+1)), t=o[j]; o[j]=o[r]; o[r]=t; }
    if(n>1 && o[0]===last){ o[0]=o[1]; o[1]=last; }
    MUSIC.order=o; MUSIC.i=0;
  }
  var tr=MUSIC.list[MUSIC.order[MUSIC.i]];
  MUSIC.name=tr.n; MUSIC.el.src=tr.u; MUSIC.pending=false;
  MUSIC.paint(true);
  if(MUSIC.cur>0 || MUSIC.want()) MUSIC.play();
};
MUSIC.want=function(){ return !MUSIC.off && state==='menu'; };
MUSIC.play=function(){
  if(!MUSIC.el || MUSIC.pending) return;
  MUSIC.pending=true; MUSIC.apply();
  var p; try{ p=MUSIC.el.play(); }catch(e){ MUSIC.pending=false; MUSIC.block(); return; }
  if(p && p.then) p.then(function(){ MUSIC.pending=false; if(MUSIC.blocked){ MUSIC.blocked=false; MUSIC.paint(); } },
                         function(){ MUSIC.pending=false; MUSIC.block(); });
  else MUSIC.pending=false;
};
MUSIC.block=function(){ if(!MUSIC.blocked){ MUSIC.blocked=true; MUSIC.paint(); } };
/* первое касание / клавиша: звук разрешён — включаем и пропускаем через WebAudio (громкость на iPhone) */
MUSIC.unlock=function(){
  if(!MUSIC.el) return;
  audioInit(); applySfx();
  if(AC && AC.state!=='running'){ try{ AC.resume(); }catch(e){} }
  if(!MUSIC.routed && AC){
    try{ var s=AC.createMediaElementSource(MUSIC.el), g=AC.createGain(); s.connect(g); g.connect(AC.destination); MUSIC.gain=g; MUSIC.routed=true; MUSIC.el.volume=1; }catch(e){}
  }
  if(MUSIC.want() && (MUSIC.el.paused || MUSIC.blocked)){ MUSIC.pending=false; MUSIC.play(); }
};
MUSIC.apply=function(){
  if(!MUSIC.el) return;
  var v=clamp(MUSIC.cur*VOL.mus,0,1);
  if(MUSIC.routed && MUSIC.gain) MUSIC.gain.gain.value=v; else MUSIC.el.volume=v;
};
MUSIC.tick=function(dt){
  if(!MUSIC.el) return;
  var tgt=MUSIC.want()?1:0;
  if(MUSIC.cur!==tgt){ MUSIC.cur = tgt>MUSIC.cur ? Math.min(1, MUSIC.cur+dt/0.8) : Math.max(0, MUSIC.cur-dt/0.8); MUSIC.apply(); }
  if(tgt && MUSIC.el.paused && !MUSIC.blocked && !MUSIC.pending) MUSIC.play();
  if(!tgt && MUSIC.cur<=0 && !MUSIC.el.paused) MUSIC.el.pause();
  var np=document.getElementById('mnp'); if(np) np.classList.toggle('paused', MUSIC.el.paused);
};
/* плашка «сейчас играет»: одна строка «BvR — трек», смена трека — плавно */
MUSIC.paint=function(fade){
  var np=document.getElementById('mnp'), tx=document.getElementById('mnpTx'), rt=document.getElementById('rotate'), rn=document.getElementById('rotNp');
  if(np) np.classList.toggle('off', MUSIC.off || !MUSIC.name);
  if(rt) rt.classList.toggle('blocked', MUSIC.blocked && !MUSIC.off);
  setText('rotSnd', T('tapSnd'));
  var line=(MUSIC.off || !MUSIC.name) ? '' : 'BvR — '+MUSIC.name;
  if(rn) rn.textContent=line ? '♪ '+line : '';
  if(!tx) return;
  var html=mEsc(line)+(MUSIC.blocked?'<small>'+mEsc(T('tapSnd'))+'</small>':'');
  if(fade && tx.innerHTML){ tx.classList.add('fade'); setTimeout(function(){ tx.innerHTML=html; tx.classList.remove('fade'); }, 450); }
  else tx.innerHTML=html;
};
['touchend','pointerdown','keydown','click'].forEach(function(ev){ window.addEventListener(ev, function(){ MUSIC.unlock(); }, true); });

/* ============================================================
   ТРЕНИРОВКА (docs/MENU_PLAN.md, этап 5)
   10 уроков и свободная тренировка — офлайн, на той же симуляции (shared/sim.js не меняется). Урок расставляет
   игроков (лишние — boxed: их нет на льду), держит «прибитых» на месте или ведёт по маршруту (TRAIN.pins — после
   каждого шага), сам решает, что такое попытка, и перехватывает гол и свисток: вместо вбрасывания — новая попытка.
   Медали: бронза — урок выполнен, серебро и золото — по времени, точности или числу попыток. Лучшая медаль урока —
   в CloudStorage + localStorage ('train'). TRAIN.bot — скрипт ввода для автотеста (tools/smoke-train.mjs): ведёт
   своего игрока стиком и кнопками, как человек.
   ============================================================ */
var TRAIN={on:false, i:-1, L:null, t:0, n:0, miss:0, tries:0, d:{}, pins:[], res:null, bot:false, msg:'', msgT:0, hud:''};
var TPROG={l:{}};
prefGet('train', function(v){
  var o=null; try{ o=JSON.parse(v); }catch(e){}
  if(!o || !o.l) return;
  for(var k in o.l){ var a=o.l[k], b=TPROG.l[k]; if(a && (!b || (a.m|0)>(b.m|0) || ((a.m|0)===(b.m|0) && (a.done && !b.done)))) TPROG.l[k]=a; }
  if(typeof MENU!=='undefined' && MENU.ready) MENU.repaint();
});
function tMedals(){ var s=0; for(var k in TPROG.l) s+=TPROG.l[k].m|0; return s; }

/* ---------- код уроков: отдельный файл (assets/src/train.js → assets/dist/train.<хеш>.js, ASSETS.train) ----------
   Грузится при входе в «Тренировку» и на первом запуске; старт урока до загрузки ждёт её с экраном загрузки.
   Код получает доступ к игре только через K (ниже). */
var TRAINJS={st:0, cbs:[], mod:null};   /* st: 0 не грузили, 1 грузится, 2 готов, 3 ошибка (следующий вызов — заново) */
function trainLoad(cb){
  if(TRAINJS.st===2){ if(cb) cb(true); return; }
  if(cb) TRAINJS.cbs.push(cb);
  if(TRAINJS.st===1) return;
  TRAINJS.st=1;
  var done=function(ok){ TRAINJS.st=ok?2:3; var a=TRAINJS.cbs; TRAINJS.cbs=[]; for(var i=0;i<a.length;i++) a[i](ok); };
  var s=document.createElement('script');
  s.src=(window.ASSETS && ASSETS.train) || 'assets/src/train.js';
  s.onload=function(){
    try{
      var K={IN:IN, stick:stick, T:T, SFX:SFX, buzz:buzz, attackDir:attackDir, GOAL_X:GOAL_X, pt:pt,
             TRAIN:TRAIN, trainEnd:trainEnd, trainHud:trainHud, placeFaceoff:placeFaceoff, setTactic:setTactic,
             ctrl:function(p){ controlled=p; }};
      Object.defineProperties(K, {HUMAN:{get:function(){ return HUMAN; }}, F:{get:function(){ return F; }},
        cyw:{get:function(){ return _cyw; }}, syw:{get:function(){ return _syw; }}, LANG:{get:function(){ return LANG; }}});
      var M=window.BVRTrain(K);
      M.lessons.forEach(function(c){ for(var i=0;i<LESSONS.length;i++) if(LESSONS[i].key===c.key) for(var k in c) LESSONS[i][k]=c[k]; });
      TRAINJS.mod=M; BOOT.train=Math.round(performance.now()); done(true);
    }catch(e){ TEST.errors.push('train: '+e); console.error('train', e); done(false); }
  };
  s.onerror=function(){ done(false); };
  document.head.appendChild(s);
}

/* медали: 'time' и 'tries' (число попыток) — меньше лучше, 'count' — больше лучше; бронза — урок выполнен */
function tMedal(L, v){
  if(!(L.isDone ? L.isDone() : true)) return 0;
  var th=L.th;
  if(L.kind==='count') return v>=th[2]?3:(v>=th[1]?2:1);
  return v<=th[2]?3:(v<=th[1]?2:1);
}
function trainEnd(done){
  var L=TRAIN.L; if(TRAIN.res) return;
  var v=L.val ? L.val() : TRAIN.t, m=done ? tMedal(L, v) : 0;
  TRAIN.res={done:!!done, medal:m, v:v};
  if(L.key!=='free'){
    var p=TPROG.l[L.key]||{m:0, done:false};
    if(m>(p.m|0)) p.m=m;
    if(done) p.done=true;
    if(done && (p.best===undefined || (L.kind==='count' ? v>p.best : v<p.best))) p.best=v;
    TPROG.l[L.key]=p; prefSet('train', JSON.stringify(TPROG));
  }
  IN.A=IN.B=IN.X=IN.Y=IN.RTb=IN.LB=false; stick.dx=0; stick.dz=0;
  state='over';
  if(done) buzz(30,'goal');
  showTrainResult();
}
function tFmt(L, v){
  if(L.kind==='count') return v+' '+T('tOf')+' '+(L.of||L.tries);
  if(L.kind==='tries') return v+' '+T('tTriesN');
  return (Math.round(v*10)/10).toFixed(1).replace('.', LANG==='en'?'.':',')+' '+T('tSec');
}
function tTh(L, k){
  if(L.kind==='count') return L.th[k]+' '+T('tOf')+' '+(L.of||L.tries);
  if(L.kind==='tries') return '≤ '+L.th[k]+' '+T('tTriesN');
  return '≤ '+L.th[k]+' '+T('tSec');
}

function trainStart(i){
  audioInit();

  if(TRAINJS.st!==2){ if(!LOADING_ON){ loadingShow(true); trainLoad(function(ok){ loadingShow(false); if(ok) trainStart(i); }); } return; }
  ONLINE=false; netLeave(); NET.on=false; HUMAN=TEST.side;
  TEAM[0]=CLUBS[0]; TEAM[1]=CLUBS[3]; buildTeamMeshes();
  MATCH_MIN=99; score[0]=0; score[1]=0; period=1; clock=99*60; pen.length=0;

  TACTIC[0]=0; TACTIC[1]=0; gkRush[0]=false; gkRush[1]=false;
  setPaused(false); hideResult();
  TRAIN.on=true; TRAIN.i=i; TRAIN.L=LESSONS[i]; TRAIN.t=0; TRAIN.n=0; TRAIN.miss=0; TRAIN.tries=0; TRAIN.res=null;
  TRAIN.d={}; TRAIN.pins=[]; TRAIN.msg=''; TRAIN.msgT=0; TRAIN.hud='';

}
function trainStop(){
  if(!TRAIN.on) return;

  for(var i=0;i<players.length;i++) players[i].boxed=0;

/* ============================================================
   СТАТИСТИКА МАТЧА — считается только по событиям, одинаково у хоста
   и у гостя (гость получает те же события по сети)
   ============================================================ */
function statsTeam(){ return {shots:0, sog:0, goals:0, passes:0, passesDone:0, saves:0,
                              hits:0, penalties:0, pokes:0, takeaways:0, posts:0}; }
var STATS=null;
function statsReset(){ STATS={teams:[statsTeam(),statsTeam()], players:{}, faceoffs:0, events:0}; }
statsReset();
function statsP(i){
  if(i<0 || !players[i]) return null;
  return STATS.players[i] || (STATS.players[i]={t:players[i].team, num:players[i].num, g:0, a:0, s:0, h:0});
}
EV.on('*', function(e,n){
  if(!STATS) return;
  STATS.events++;
  var T0=STATS.teams, tm=(e.t===0||e.t===1)?T0[e.t]:null, ps;
  switch(n){
    case 'faceoff': STATS.faceoffs++; break;
    case 'shot': tm.shots++; if((ps=statsP(e.p))) ps.s++; break;
    case 'pass': tm.passes++; break;
    case 'pass:recv': tm.passesDone++; break;
    case 'save': if(e.shot){ tm.saves++; T0[1-e.t].sog++;
                   if(e.noShot){ T0[1-e.t].shots++; if((ps=statsP(e.by))) ps.s++; } } break;
    case 'goal': tm.goals++; if(!e.own){ tm.sog++; if(e.noShot){ tm.shots++; if((ps=statsP(e.p))) ps.s++; } }
                 if((ps=statsP(e.p))) ps.g++; if((ps=statsP(e.assist))) ps.a++; break;
    case 'hit': tm.hits++; if((ps=statsP(e.p))) ps.h++; break;
    case 'penalty': tm.penalties++; break;
    case 'poke': tm.pokes++; break;
    case 'pickup': if(e.turnover) tm.takeaways++; break;
    case 'post': if(tm) tm.posts++; break;
  }
});
/* короткая сводка для __hk.snap() и smoke: [команда 0, команда 1] */
function statsBrief(){
  var o={}, a=STATS.teams[0], b=STATS.teams[1];
  for(var k in a) o[k]=[a[k],b[k]];
  o.faceoffs=STATS.faceoffs; o.events=STATS.events;
  return o;
}

/* ============================================================
   ИТОГ МАТЧА (match:summary) → Worker + D1 (docs/EVENTS.md)
   Клиент монеты не начисляет: он только сообщает, как прошёл матч.
   Worker проверяет подпись Telegram initData и лимиты и сам решает,
   сколько начислить.
   ============================================================ */
var CLIENT_VER=1;
/* адрес Worker'а статистики (server/api.js); пусто — итоги никуда не отправляются.
   Локальная разработка и автотесты в боевой API не ходят; на localhost можно указать свой: ?api=http://127.0.0.1:8799 */
var STATS_API=(function(){
  var local=/^(localhost|127\.|\[::1\])/.test(location.hostname), q='';
  try{ q=new URLSearchParams(location.search).get('api')||''; }catch(e){}
  if(local) return /^https?:\/\//.test(q) ? q.replace(/\/+$/,'') : '';
  return 'https://bvr-hockey-relay.bvrhockey.workers.dev';
})();
var MATCH={id:'', mode:'ai', role:'solo', team:0, difficulty:'normal', clubs:[0,0], len:0, played:0,
           startedAt:0, summary:null, sent:false, reward:null};
function newMatchId(){
  var b=new Uint8Array(12), s='';
  try{ crypto.getRandomValues(b); }catch(e){ for(var i=0;i<12;i++) b[i]=(Math.random()*256)|0; }
  for(var j=0;j<12;j++) s+=(b[j]<16?'0':'')+b[j].toString(16);
  return s;
}
function matchStart(id, clubA, clubB){
  /* Telegram на компьютере, окно вертикальное — на весь экран (Bot API 8.0+) */
  if(isDesktopTG() && innerHeight>innerWidth){
    try{ if(TG && TG.requestFullscreen && (!TG.isVersionAtLeast || TG.isVersionAtLeast('8.0'))) TG.requestFullscreen(); }catch(e){}
  }
  MATCH.id=id; MATCH.mode=NET.on?'online':'ai'; MATCH.role=NET.on?NET.role:'solo'; MATCH.net=NET.on?(NET.srv?'server':'host'):null;
  MATCH.team=HUMAN; MATCH.clubs=[clubA,clubB]; MATCH.len=Math.round(clock);
  MATCH.played=0; MATCH.startedAt=Date.now(); MATCH.summary=null; MATCH.sent=false; MATCH.reward=null;
  MATCH.stake=(NET.on && NET.srv && STK.live && STK.live.id===id) ? STK.live.n : 0;
  MATCH.difficulty = NET.on ? null : DIFF;   /* в сетевом матче соперник — человек */
  NET.dc={self:0, selfLeft:false, opp:false, oppLeft:false}; NET.w=0; netBanner();
  statsReset();
  EV.emit('match:start',{id:id, mode:MATCH.mode, role:MATCH.role, team:HUMAN, len:MATCH.len, clubs:MATCH.clubs.slice(), difficulty:MATCH.difficulty});
}
function buildSummary(sc){
  var me=MATCH.team, res = sc[me]>sc[1-me]?'win':(sc[me]<sc[1-me]?'loss':'draw');
  /* обрывы связи в сетевом матче: self — сколько раз переподключался сам, opp — пропадал ли соперник,
     selfLeft / oppLeft — не вернулся за 30 с (у не вернувшегося result:'left', счёт — на момент обрыва) */
  var dc=(MATCH.mode==='online' && NET.dc && (NET.dc.self||NET.dc.selfLeft||NET.dc.opp)) ?
    {self:NET.dc.self, selfLeft:NET.dc.selfLeft, opp:NET.dc.opp, oppLeft:NET.dc.oppLeft} : null;
  if(dc && dc.selfLeft) res='left';
  var pl=[];
  for(var k in STATS.players){ var q=STATS.players[k]; pl.push({t:q.t, num:q.num, g:q.g, a:q.a, s:q.s, h:q.h}); }
  return {v:1, id:MATCH.id, client:CLIENT_VER, mode:MATCH.mode, role:MATCH.role, net:MATCH.net||null, team:me, difficulty:MATCH.difficulty,
          room:MATCH.mode==='online'?NET.code:null,  /* по коду комнаты Worker сверит счёт серверного матча с Durable Object */
          clubs:MATCH.clubs.slice(), len:MATCH.len, played:Math.round(MATCH.played),
          startedAt:MATCH.startedAt, endedAt:Date.now(), score:sc.slice(), result:res, disconnect:dc,
          teams:[STATS.teams[0], STATS.teams[1]], players:pl, faceoffs:STATS.faceoffs, events:STATS.events,
          test:!!(TEST.autostart||TEST.autopilot||TEST.seed)};
}
EV.on('match:end', function(e){
  if(MATCH.summary) return;          /* гость может получить match:end повторно */
  MATCH.summary=buildSummary(e.score||score);
  EV.emit('match:summary', MATCH.summary);
});

/* отправка итога: очередь в localStorage переживает обрыв сети и закрытие
   приложения; отправляем при конце матча и при старте следующего */
var SUMQ_KEY='bvr_pending_matches';
function sumQueue(){ try{ return JSON.parse(localStorage.getItem(SUMQ_KEY))||[]; }catch(e){ return []; } }
function sumQueueSave(q){ try{ localStorage.setItem(SUMQ_KEY, JSON.stringify(q.slice(-10))); }catch(e){} }
function sumFlush(){
  if(!STATS_API || !TG || !TG.initData) return;
  var q=sumQueue();
  q.forEach(function(sum){
    fetch(STATS_API+'/v1/match', {method:'POST', keepalive:true,
      headers:apiHeaders(true),
      body:JSON.stringify(sum)})
    .then(function(r){
      /* 2xx — принят, 4xx — отвергнут навсегда (подпись, неправдоподобный итог, дубль): в обоих случаях убираем;
         429 (рано после прошлого матча) и 5xx — остаётся до следующей попытки */
      if(r.status<500 && r.status!==429) sumQueueSave(sumQueue().filter(function(x){ return x.id!==sum.id; }));
      else EV.emit('match:rewardLater', {id:sum.id});
      if(!r.ok && r.status<500 && r.status!==429) EV.emit('match:rewardNone', {id:sum.id});   /* отвергнут: начислять нечего */
      return r.ok ? r.json() : null;
    })
    .then(function(res){ if(res) EV.emit('match:reward', res); })
    .catch(function(){ EV.emit('match:rewardLater', {id:sum.id}); /* сеть: попробуем в следующий раз */ });
  });
}
EV.on('match:summary', function(sum){
  if(sum.test || !STATS_API) return;  /* автотесты и сборки без бэкенда ничего не шлют */
  var q=sumQueue(); if(!q.some(function(x){ return x.id===sum.id; })) q.push(sum);
  sumQueueSave(q); MATCH.sent=true;
  if(resultShown()) rwShow();       /* экран итога уже открыт — «начисляем…» до ответа */
  sumFlush();
});
EV.on('match:start', function(){ sumFlush(); });

/* монеты: баланс знает только сервер (GET /v1/profile, ответ на итог матча); здесь — копия для показа */
var COINS=null;   /* null — неизвестен: вне Telegram или сервер ещё ни разу не ответил */
try{ var _c0=localStorage.getItem('bvr_coins'); if(_c0 && isFinite(+_c0)) COINS=Math.max(0, Math.floor(+_c0)); }catch(e){}
/* ---------- ставка на матч с другом (только серверная схема; правила — server/coins.js, docs/EVENTS.md) ----------
   Хост выбирает ставку на подготовке, гость её принимает; сервер проверяет баланс обоих и при старте блокирует ставку,
   итог решает только результат комнаты. Ставятся только монеты — звёзды никогда. STK — что прислала комната. */
var STAKES=[0,10,25,50,100];
var STK={n:0, ok:[0,0], live:null, auth:false};
function stakeOn(){ return !!(ONLINE && NET.on && NET.srv && NET.stk && STK.auth); }
function stakeLabel(n){ return n>0 ? curHtml('coin', n) : mEsc(T('stNone')); }
function stakeStep(d){
  if(!stakeOn() || NET.role!=='host') return;
  /* суммы больше известного баланса пропускаем (сервер всё равно проверит) */
  var opts=STAKES.filter(function(v){ return COINS===null || v<=COINS; }); if(!opts.length) opts=[0];
  var i=opts.indexOf(STK.n); if(i<0) i=0;
  netSend({t:'stake', n:opts[(i+d+opts.length)%opts.length]});
}

/* звёзды (Telegram Stars) — донат: оформление, отключение рекламы, обмен на монеты в Магазине (в одну сторону);
   баланс тоже с сервера (/v1/profile); в ставках не участвуют */
var STARS=null;
try{ var _s0=localStorage.getItem('bvr_stars'); if(_s0 && isFinite(+_s0)) STARS=Math.max(0, Math.floor(+_s0)); }catch(e){}
/* ---------- пополнение звёзд за Telegram Stars (docs/EVENTS.md «Звёзды») ----------
   Пакеты и цены — с сервера (/v1/profile, /v1/stars/packs). Покупка: POST /v1/stars/invoice → ссылка на счёт →
   Telegram.WebApp.openInvoice; 'paid' — ждём, пока вебхук бота запишет оплату (GET /v1/stars/order), и только тогда
   звёзды летят в кошелёк; 'cancelled' / 'failed' — ничего не начислено. Сам клиент звёзды не начисляет. Вне Telegram
   кнопки нет. */
var PACKS=null;
try{ var _p0=JSON.parse(localStorage.getItem('bvr_packs')||'null'); if(Array.isArray(_p0) && _p0.length) PACKS=_p0; }catch(e){}
var SB={st:null, pack:null, order:null, got:0}, SB_WAIT_MS=30000;
function starsBuyOK(){
  try{ return !!(STATS_API && inTelegram() && TG.openInvoice && (!TG.isVersionAtLeast || TG.isVersionAtLeast('6.1'))); }catch(e){ return false; }
}
/* заголовки запросов к API: подпись Telegram и платформа (Telegram.WebApp.platform — для статистики, docs/EVENTS.md) */
function apiHeaders(json){
  var h={'X-Telegram-Init-Data':TG.initData}, pf='';
  try{ pf=String(TG.platform||''); }catch(e){}
  if(/^[a-z_]{1,16}$/.test(pf)) h['X-Tg-Platform']=pf;
  if(json) h['Content-Type']='application/json';
  return h;
}
function packsSet(p){
  if(!Array.isArray(p) || !p.length) return;
  var was=JSON.stringify(PACKS); PACKS=p;
  try{ localStorage.setItem('bvr_packs', JSON.stringify(p)); }catch(e){}

}
function packsFetch(){
  if(!starsBuyOK()) return;
  fetch(STATS_API+'/v1/stars/packs', {headers:apiHeaders()}).then(function(r){ return r.ok ? r.json() : null; })
  .then(function(j){ if(j){ packsSet(j.packs); cpacksSet(j.coinPacks); } }).catch(function(){});
}
/* (экраны меню строятся раньше, чем выполнится этот блок: SB ещё нет) */
function sbBusy(){ return !!SB && (SB.st==='make' || SB.st==='open' || SB.st==='wait'); }
function sbPaint(){
  if(!MENU.ready) return;

  if(MENU.top()==='stars' && MENU.layer()==='menu') MENU.refocus();
}
function sbBuy(id){
  if(sbBusy() || !starsBuyOK()) return;
  SB={st:'make', pack:id, order:null, got:0}; sbPaint();
  fetch(STATS_API+'/v1/stars/invoice', {method:'POST', headers:apiHeaders(true), body:JSON.stringify({pack:id})})
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(j){
    if(!j || !j.link){ SB.st='err'; sbPaint(); return; }
    SB.order=j.order; SB.st='open'; sbPaint();
    try{ TG.openInvoice(j.link, function(status){ sbAfter(j.order, status); }); }
    catch(e){ SB.st='err'; sbPaint(); }
  })
  .catch(function(){ SB.st='err'; sbPaint(); });
}
/* окно оплаты закрылось: status от Telegram — 'paid' | 'cancelled' | 'failed' | 'pending' */
function sbAfter(order, status){
  if(SB.order!==order) return;
  if(status==='paid' || status==='pending'){ SB.st='wait'; sbPaint(); sbPoll(order, Date.now()); }
  else { SB.st=status==='failed' ? 'fail' : 'cancel'; sbPaint(); }
}
function sbPoll(order, t0){
  if(SB.order!==order) return;
  fetch(STATS_API+'/v1/stars/order?id='+encodeURIComponent(order), {headers:apiHeaders()})
  .then(function(r){ return r.ok ? r.json() : null; })
  .catch(function(){ return null; })
  .then(function(j){
    if(SB.order!==order) return;
    if(j && j.status==='paid'){ sbDone(j); return; }
    if(Date.now()-t0>SB_WAIT_MS){ SB.st='later'; sbPaint(); setTimeout(profileFetch, 20000); return; }
    setTimeout(function(){ sbPoll(order, t0); }, 1200);
  });
}
/* оплата подтверждена сервером: звёзды летят от карточки пакета к балансу, баланс растёт по мере прилёта */
function sbDone(j){
  var to=j.balance|0, from=Math.max(0, to-(j.stars|0));
  SB.st='done'; SB.got=j.stars|0; STARS=from; sbPaint();
  walletFly('star', document.querySelector('#start .msbp[data-pack="'+SB.pack+'"]'), from, to, function(v){ coinsSet(undefined, v); });
}

/* ---------- монеты за звёзды (Магазин; docs/EVENTS.md «Монеты за звёзды») ----------
   В одну сторону: звёзды → монеты. Пакеты — с сервера (CPACKS из /v1/profile). Нажатие на пакет → подтверждение →
   POST /v1/shop/coins {pack, idem} (idem — один на подтверждение: повтор того же запроса сервер не спишет дважды) →
   монеты летят в кошелёк. Не хватает звёзд (видно по балансу или ответ 402) — кнопка «Пополнить звёзды». */
var CPACKS=null;
try{ var _cp0=JSON.parse(localStorage.getItem('bvr_cpacks')||'null'); if(Array.isArray(_cp0) && _cp0.length) CPACKS=_cp0; }catch(e){}
var SH={st:null, pack:null, idem:''};
function coinShopOK(){ try{ return !!(STATS_API && inTelegram() && CPACKS); }catch(e){ return false; } }
function cpack(id){ return (CPACKS||[]).filter(function(p){ return p.id===id; })[0]||null; }
function cpacksSet(p){
  if(!Array.isArray(p) || !p.length) return;
  var was=JSON.stringify(CPACKS); CPACKS=p;
  try{ localStorage.setItem('bvr_cpacks', JSON.stringify(p)); }catch(e){}
  if(MENU.ready && was!==JSON.stringify(p)){ MENU.build('shop'); if(MENU.top()==='shop') MENU.refocus(); }
}
function shPaint(){
  if(!MENU.ready) return;
  MENU.build('shop');
  if(MENU.top()==='shop' && MENU.layer()==='menu'){
    /* фокус — на кнопку подтверждения, если она есть */
    var it=MENU.items('menu'), b=MENU.sec.shop.querySelector('[data-act="cyes"],[data-act="topup"]'), i=b ? it.indexOf(b) : -1;
    if(i>=0) MENU.setFocus(i, 'menu'); else MENU.refocus();
  }
}
function shIdem(){
  var b=new Uint8Array(12), s='';
  try{ crypto.getRandomValues(b); }catch(e){ for(var i=0;i<12;i++) b[i]=(Math.random()*256)|0; }
  for(var j=0;j<12;j++) s+=(b[j]<16?'0':'')+b[j].toString(16);
  return s;
}
function shAsk(id){
  var p=cpack(id); if(!p || (SH && SH.st==='buy')) return;
  SH={st:(STARS!==null && STARS<p.stars) ? 'no' : 'ask', pack:id, idem:shIdem()};
  shPaint();
}
function shBuy(){
  if(!SH || SH.st!=='ask' || !coinShopOK()) return;
  var p=cpack(SH.pack), idem=SH.idem, wasCoins=COINS; if(!p) return;
  SH.st='buy'; shPaint();
  fetch(STATS_API+'/v1/shop/coins', {method:'POST', headers:apiHeaders(true), body:JSON.stringify({pack:p.id, idem:idem})})
  .then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }, function(){ return {s:r.status, j:null}; }); })
  .then(function(x){
    if(SH.idem!==idem) return;
    if(x.s===402 && x.j){ coinsSet(undefined, x.j.have); SH.st='no'; shPaint(); return; }
    if(x.s!==200 || !x.j || !x.j.balance){ SH.st='err'; shPaint(); return; }
    var to=x.j.balance.coins, from=Math.max(0, to-p.coins);
    if(x.j.repeat && wasCoins!==null) from=to;            /* уже было куплено этим же запросом: лететь нечему */
    SH.st='done'; COINS=from; coinsSet(undefined, x.j.balance.stars); shPaint();
    var card=document.querySelector('#start section.cur .mshc[data-pack="'+p.id+'"]');
    walletFly('coin', card, from, to, function(v){ coinsSet(v); });
  })
  .catch(function(){ if(SH.idem===idem){ SH.st='err'; shPaint(); } });
}
/* монеты / звёзды летят от элемента к кошельку текущего экрана; баланс растёт по мере прилёта (set(v)) */
function walletFly(kind, fromEl, from, to, set){
  var wl=document.querySelector('#start section.cur [data-'+(kind==='coin'?'coins':'stars')+']');
  var quiet=false; try{ quiet=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(!fromEl || !wl || quiet || to<=from){ set(to); return; }
  var a=fromEl.getBoundingClientRect(), b=(wl.querySelector('.ic')||wl).getBoundingClientRect();
  var x0=a.left+a.width/2-11, y0=a.top+a.height/2-11, dx=b.left+b.width/2-11-x0, dy=b.top+b.height/2-11-y0;
  var N=Math.min(8, Math.max(3, Math.ceil((to-from)/40))), got=0;
  for(var i=0;i<N;i++) (function(i){
    var o=document.createElement('span'); o.className='rw-fx'; o.style.zIndex='30';
    o.innerHTML='<span class="rw-fy">'+icHtml(kind)+'</span>';
    o.style.transform='translate('+x0+'px,'+y0+'px)';
    document.body.appendChild(o);
    setTimeout(function(){
      o.style.opacity='1';
      o.style.transform='translate('+(x0+dx)+'px,'+y0+'px)';
      o.firstChild.style.transform='translateY('+dy+'px) scale(.85)';
      setTimeout(function(){
        if(o.parentNode) o.parentNode.removeChild(o);
        got++;
        set(got>=N ? to : from+Math.round((to-from)*got/N));
        var w=document.querySelector('#start section.cur [data-'+(kind==='coin'?'coins':'stars')+']');
        if(w){ w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop'); }
        SFX.coin(got);
      }, 620);
    }, 120+i*80);
  })(i);
}

/* иконка валюты (k: 'coin' | 'star') — символ из assets/src/icons; число рядом пишется без слова «монеты» */
function icHtml(k){ return '<svg class="ic" role="img" aria-label="'+mEsc(T(k==='star'?'pStars':'pCoins'))+'"><use href="#ic-'+k+'"/></svg>'; }
function curHtml(k, v){ return '<span class="cval">'+icHtml(k)+'<span class="cn">'+mEsc(v)+'</span></span>'; }
/* кошелёк: монеты и звёзды; неизвестный баланс (вне Telegram, сервер ни разу не ответил) — «—».
   top — у звёзд кнопка «Пополнить» (главное, профиль; только в Telegram) */

function coinsSet(v, stars){

EV.on('match:reward', function(res){
  coinsSet(res.balance);
  if(res.id && res.id===MATCH.id){ MATCH.reward=res; rwState(res.id, 'done', res); }
});
/* итог не принят сейчас (очередь: 429, 5xx, нет сети) — «начислится позже» */
EV.on('match:rewardLater', function(e){ if(e.id===MATCH.id) rwState(e.id, 'later'); });
EV.on('match:rewardNone', function(e){ if(e.id===MATCH.id && RW.id===e.id && RW.st!=='done'){ clearTimeout(RW.timer); RW.st=null; rwPaint(); } });

/* ---------- начисление на экране итога ----------
   Анимация — только по ответу сервера (/v1/match, событие match:reward): пока ответа нет — «начисляем…»; ошибка,
   очередь или нет ответа за RW_LATER_MS — «начислится позже» (ответ позже — анимация всё равно проиграется).
   Строки «за что» (результат, голы и передачи, пометка о дневном лимите), итог набирается счётчиком, монеты летят к
   балансу в шапке, баланс растёт по мере прилёта, на каждую — звон (SFX.coin, громкость звуков из Настроек).
   Начислено 0 — без летящих монет. Лёгкая для слабых телефонов: ≤ 8 элементов, только transform / opacity, без
   фильтров и теней; prefers-reduced-motion — сразу итог. Вне Telegram и в автотестах итог не отправляется — блока нет. */
var RW_LATER_MS=8000;
var RW={id:'', st:null, res:null, played:'', timer:0, raf:0, fly:[], t:[]};
function rwTotal(res){ return (res.coins|0)+(res.stake && res.stake.delta|0); }
function rwFrom(res){ return Math.max(0, res.balance-rwTotal(res)); }
function rwRows(res){
  var h='', p=res.parts||{};
  var row=function(k, v){ return '<div class="rw-r"><span class="rk">'+mEsc(k)+'</span>'+v+'</div>'; };
  var lab={win:'rwWin', draw:'rwDraw', loss:'rwLoss', left:'rwLeft'}[p.res];
  if(lab) h+=row(T(lab), curHtml('coin', (p.base>0?'+':'')+(p.base|0)));
  if(p.bonus>0) h+=row(T('rwBonus'), curHtml('coin', '+'+p.bonus));
  var st=res.stake;
  if(st && st.n>0){
    var sk={win:'rwStWin', loss:'rwStLoss', back:'rwStBack'}[st.out]||'rwStWait';
    h+=row(T(sk), curHtml('coin', st.out==='win'||st.out==='back' ? '+'+st.delta : st.out==='loss' ? '−'+st.n : st.n));
  }
  if(res.verdict==='capped') h+='<div class="rw-note">'+mEsc(T('rwCap'))+'</div>';
  return h;
}
function rwWal(v){
  var wl=document.getElementById('oWal'); if(!wl) return;
  var c=curHtml('coin', v===null||v===undefined ? '—' : v); if(wl.innerHTML!==c) wl.innerHTML=c;
}
/* что видно сейчас, без анимации */
function rwPaint(){
  var el=document.getElementById('oReward'), wl=document.getElementById('oWal'); if(!el) return;
  var on=RW.id===MATCH.id && RW.st;
  if(wl) wl.style.visibility=on?'':'hidden';
  if(!on){ el.innerHTML=''; el.className=''; return; }
  if(RW.st!=='done'){
    el.className='rw-'+RW.st; el.innerHTML=(RW.st==='wait'?'<i></i>':'')+mEsc(T(RW.st==='wait'?'rwWait':'rwLater')); rwWal(COINS); return;
  }
  var res=RW.res, tot=rwTotal(res), done=RW.played===RW.id;
  el.className='rw-done';
  el.innerHTML='<div class="rw-rows">'+rwRows(res)+'</div><div class="rw-tot"><span class="rk">'+mEsc(T('rwTotal'))+'</span>'+
    '<span class="cval">'+icHtml('coin')+'<span class="cn" id="oRwN">'+(tot>0?'+':'')+(done?tot:0)+'</span></span></div>';
  rwWal(done ? res.balance : rwFrom(res));
}
function rwState(id, st, res){
  if(id!==MATCH.id) return;
  if(RW.id!==id){ RW.id=id; RW.played=''; RW.st=null; }
  if(RW.st==='done') return;                          /* ответ уже есть: поздний таймаут или повтор не трогают */
  RW.st=st; if(res) RW.res=res;
  clearTimeout(RW.timer);
  if(st==='wait') RW.timer=setTimeout(function(){ rwState(id, 'later'); }, RW_LATER_MS);
  rwPaint();
  if(st==='done' && resultShown()) rwPlay();
}
function resultShown(){ var e=document.getElementById('overscr'); return !!(e && e.style.display==='flex'); }
/* экран итога открылся: ждём ответа сервера или сразу показываем (и проигрываем) пришедший */
function rwShow(){
  if(MATCH.id && RW.id!==MATCH.id && MATCH.sent && STATS_API && TG && TG.initData) rwState(MATCH.id, MATCH.reward ? 'done' : 'wait', MATCH.reward);
  rwPaint();
  if(RW.st==='done' && RW.id===MATCH.id) rwPlay();
}
function rwStop(){
  cancelAnimationFrame(RW.raf); RW.raf=0;
  RW.t.forEach(clearTimeout); RW.t=[];
  RW.fly.forEach(function(o){ if(o.parentNode) o.parentNode.removeChild(o); }); RW.fly=[];
  if(RW.st==='done' && RW.played===RW.id) rwPaint();     /* прервали посреди — сразу итог */
}
function rwPlay(){
  if(RW.st!=='done' || RW.played===RW.id) return;
  RW.played=RW.id;
  var res=RW.res, tot=rwTotal(res), from=rwFrom(res), to=res.balance;
  var nEl=document.getElementById('oRwN'), wl=document.getElementById('oWal'), lay=document.getElementById('overscr');
  var quiet=false; try{ quiet=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(!nEl || !wl || tot<=0 || quiet){ rwPaint(); return; }
  /* счётчик 0 → итог за 0.8 с, после строк «за что» */
  var t0=performance.now()+350;
  (function step(){
    var k=Math.min(1, Math.max(0, (performance.now()-t0)/800)), e=1-Math.pow(1-k, 3);
    nEl.textContent='+'+Math.round(tot*e);
    RW.raf = k<1 ? requestAnimationFrame(step) : 0;
  })();
  /* монеты: от итога к балансу; X и Y на разных кривых — получается дуга */
  var N=Math.min(8, Math.max(3, Math.ceil(tot/5))), got=0;
  RW.t.push(setTimeout(function(){
    var a=nEl.getBoundingClientRect(), b=(wl.querySelector('.ic')||wl).getBoundingClientRect();
    var x0=a.left-16, y0=a.top+a.height/2-11, dx=b.left+b.width/2-11-x0, dy=b.top+b.height/2-11-y0;
    for(var i=0;i<N;i++) (function(i){
      var o=document.createElement('span'); o.className='rw-fx';
      o.innerHTML='<span class="rw-fy">'+icHtml('coin')+'</span>';

/* ---------- закрытый экран (страница разработчика) ----------
   В игре нет ни его кода, ни текстов: сервер отвечает на /v1/admin/me 200 только тем, кто в ADMIN_IDS (по Telegram id
   из проверенного initData), остальным — 403, и на этом всё. При 200 появляется пункт меню с подписью от сервера, а сам
   экран сервер отдаёт текстом (/v1/admin/ui.js) — он выполняется с узким набором функций меню (K). Только просмотр.
   Ответ на /v1/admin/me: 200 — пункт есть; 4xx (403 — не разработчик, 401) — окончательно, больше не спрашиваем до
   перезапуска (обычный игрок делает ровно один запрос). Сеть / 5xx / нет ответа за EXT_TIMEOUT — повтор через 2, 5 и
   12 с, потом ещё по разу при каждом возврате в главное меню (не больше EXT_MAX запросов за запуск). */
var EXT={ok:false, label:'', mod:null, loading:false, st:null, n:0, t:0};   /* st: null | 'wait' | 'ok' | 'no' | 'err' */
var EXT_RETRY=[2000, 5000, 12000], EXT_TIMEOUT=10000, EXT_MAX=8;
function extCheck(){
  if(!STATS_API || !inTelegram() || EXT.st==='wait' || EXT.st==='ok' || EXT.st==='no' || EXT.n>=EXT_MAX) return;
  EXT.st='wait'; EXT.n++; clearTimeout(EXT.t);
  var ac=null, to=0, done=false;
  try{ ac=new AbortController(); }catch(e){}
  var fail=function(){
    if(done) return; done=true; clearTimeout(to);
    EXT.st='err';
    var k=EXT.n-1; if(k<EXT_RETRY.length) EXT.t=setTimeout(extCheck, EXT_RETRY[k]);   /* дальше — при возврате в главное меню */
  };
  to=setTimeout(function(){ if(ac) try{ ac.abort(); }catch(e){} fail(); }, EXT_TIMEOUT);
  fetch(STATS_API+'/v1/admin/me', ac ? {headers:apiHeaders(), signal:ac.signal} : {headers:apiHeaders()})
  .then(function(r){
    if(done) return null;
    if(r.status>=500){ fail(); return null; }
    done=true; clearTimeout(to);
    if(r.status!==200){ EXT.st='no'; return null; }
    return r.json().then(function(j){
      if(!j || !j.label){ EXT.st='no'; return; }
      EXT.st='ok'; EXT.ok=true; EXT.label=String(j.label);
      if(MENU.ready){ MENU.build('main'); if(MENU.top()==='main' && MENU.layer()==='menu') MENU.refocus(); }
    }, function(){ EXT.st='no'; });
  })
  .catch(fail);
}
function extApi(path){

}

/* ============================================================
   СОБЫТИЯ ПО СЕТИ: хост кладёт события в снимки, гость их проигрывает.
   Каждое событие едет в трёх снимках подряд (на случай потери), гость
   отбрасывает повторы по номеру seq.
   ============================================================ */
var NET_EVQ=[];
EV.on('*', function(e,n){
  if(!netHost() || !EV.NETWORKED[n] || e.remote) return;
  NET_EVQ.push({n:n, e:e, left:3});
  if(NET_EVQ.length>60) NET_EVQ.splice(0, NET_EVQ.length-60);
});
function netTakeEvents(){
  if(!NET_EVQ.length) return null;
  var out=[];
  for(var i=0;i<NET_EVQ.length;i++){ var q=NET_EVQ[i]; out.push([q.n, q.e]); q.left--; }
  NET_EVQ=NET_EVQ.filter(function(q){ return q.left>0; });
  return out;
}
function netRecvEvents(list){
  for(var i=0;i<list.length;i++){
    var n=list[i][0], e=list[i][1];
    if(!e || !(e.seq>(NET.evSeen||0))) continue;
    NET.evSeen=e.seq; e.remote=1;
    EV.emit(n, e);
  }
}
