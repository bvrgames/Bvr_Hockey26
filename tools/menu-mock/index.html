<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BVR Hockey 26 — макет меню</title>
<!-- Макет этапа 1 (docs/MENU_PLAN.md). Не часть игры: заготовка вида и раскладки.
     ?s=main|mode|prep|prepfriend|friend|train|lesson|lessondone|rules|controls|settings|pause
     &lang=ru|en|id  &st/sl/sr/sb — зона устройства, &ct — полоса кнопок Telegram (как в игре), &tg=0 — вне Telegram -->
<style>
@font-face{font-family:'BVR Sport';font-style:italic;font-weight:800;font-display:swap;
  src:url(fonts/fira-sans-extra-condensed-cyrillic-800-italic.woff2) format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'BVR Sport';font-style:italic;font-weight:800;font-display:swap;
  src:url(fonts/fira-sans-extra-condensed-latin-800-italic.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
:root{
  --st:0px; --sl:0px; --sr:0px; --sb:0px; --ct:0px;
  --top:calc(var(--st) + var(--ct));
  --bg0:#040b16; --bg1:#0a1c33; --ice0:#123356; --ice1:#2a6690;
  --txt:#f2f7ff; --dim:#9fb3c9; --mute:#6f86a1;
  --gold:#ffd166; --gold2:#f0a92e; --cyan:#8fd8ff; --mag:#c325d8; --blu:#2585ff;
  --sport:'BVR Sport','Arial Narrow',system-ui,sans-serif;
  --ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--txt);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- зимний фон: ночная арена, лёд, сугробы, снег ---------- */
.bg{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(120% 60% at 70% -10%, rgba(120,190,255,.28), transparent 60%),
    radial-gradient(60% 40% at 15% 0%, rgba(195,37,216,.18), transparent 70%),
    linear-gradient(180deg,var(--bg1) 0%, var(--bg0) 55%)}
.bg .ice{position:absolute;left:-10%;right:-10%;bottom:-2%;height:48%;
  transform:perspective(600px) rotateX(58deg);transform-origin:50% 100%;
  background:
    repeating-linear-gradient(90deg, transparent 0 11%, rgba(255,255,255,.035) 11% 11.3%),
    linear-gradient(90deg, transparent 47%, rgba(220,40,60,.45) 47% 48.2%, transparent 48.2%),
    linear-gradient(90deg, transparent 30%, rgba(40,110,230,.4) 30% 31%, transparent 31% 64%, rgba(40,110,230,.4) 64% 65%, transparent 65%),
    radial-gradient(50% 70% at 50% 100%, rgba(170,220,255,.55), transparent 70%),
    linear-gradient(180deg, var(--ice0), var(--ice1))}
.bg .ice::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.05) 18px 19px, transparent 19px 47px),
             repeating-linear-gradient(64deg, transparent 0 31px, rgba(255,255,255,.04) 31px 32px, transparent 32px 70px)}
.bg .lights{position:absolute;left:0;right:0;top:6%;height:18%;
  background:radial-gradient(closest-side,rgba(255,255,255,.55),transparent) 12% 40%/60px 60px no-repeat,
             radial-gradient(closest-side,rgba(255,255,255,.45),transparent) 38% 20%/48px 48px no-repeat,
             radial-gradient(closest-side,rgba(255,255,255,.5),transparent) 64% 30%/56px 56px no-repeat,
             radial-gradient(closest-side,rgba(255,255,255,.45),transparent) 88% 45%/52px 52px no-repeat;filter:blur(1px)}
.bg .drift{position:absolute;bottom:-40px;width:60%;height:120px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(235,246,255,.95),rgba(200,225,245,.55) 60%,transparent);filter:blur(6px)}
.bg .drift.l{left:-22%}.bg .drift.r{right:-24%;bottom:-54px}
.bg .frost{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(40% 30% at 0% 100%,rgba(225,240,255,.35),transparent 70%),
             radial-gradient(35% 28% at 100% 100%,rgba(225,240,255,.32),transparent 70%),
             radial-gradient(30% 22% at 100% 0%,rgba(225,240,255,.12),transparent 70%)}
.bg .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,8,16,.82) 0%,rgba(3,8,16,.45) 42%,rgba(3,8,16,0) 65%)}
.bg.game{background:#0b1320 url(game-bg.jpg) center/cover}
.bg.lessonbg{background:#0b1320 url(lesson-bg.jpg) center/cover}
.bg.game .shade{background:rgba(4,9,18,.72);backdrop-filter:blur(3px)}
.snow{position:fixed;inset:0;pointer-events:none}
.snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0)}}

/* ---------- каркас экрана ---------- */
.scr{position:fixed;inset:0;display:grid;gap:6px 18px;
  padding:calc(var(--top) + 8px) calc(var(--sr) + 18px) calc(var(--sb) + 10px) calc(var(--sl) + 18px);
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "left right" "foot foot"}
.head{grid-area:head;display:flex;align-items:flex-end;gap:14px;min-width:0}
.left{grid-area:left;min-height:0;display:flex;flex-direction:column;justify-content:center;min-width:0}
.right{grid-area:right;min-height:0;display:flex;align-items:center;justify-content:center;min-width:0}
.foot{grid-area:foot;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-width:0}

.brand{font:800 italic 34px/0.95 var(--sport);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 24px rgba(37,133,255,.35)}
.brand b{color:var(--gold);font-weight:800}
.brand::after{content:'';display:block;height:3px;width:62%;margin-top:4px;
  background:linear-gradient(90deg,var(--gold),var(--mag) 45%,transparent)}
.brand.sm{font-size:15px;opacity:.85;text-shadow:none}.brand.sm::after{display:none}
.crumb{display:flex;flex-direction:column;gap:2px;min-width:0}
.title{font:800 italic 30px/1 var(--sport);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;flex:none;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font:800 22px/1 var(--ui);color:#fff}
.pill{font:800 italic 13px/1 var(--sport);text-transform:uppercase;letter-spacing:.04em;padding:6px 10px;border-radius:999px;
  background:rgba(143,216,255,.14);color:var(--cyan);border:1px solid rgba(143,216,255,.3);white-space:nowrap}

/* ---------- вертикальное меню ---------- */
.menu{display:flex;flex-direction:column;gap:2px}
.mi{position:relative;padding:5px 0 5px 4px;font:800 italic 29px/1.05 var(--sport);text-transform:uppercase;color:rgba(214,228,244,.66);
  white-space:nowrap}
.mi .d{display:block;font:600 12px/1.25 var(--ui);letter-spacing:.02em;text-transform:none;color:var(--dim);margin-top:2px;
  white-space:normal;max-width:34em}
.mi:not(.on) .d{display:none}
.mi.on{color:#fff}
.mi.on::before{content:'';position:absolute;z-index:-1;top:0;bottom:0;left:calc(-1 * (var(--sl) + 18px));right:-30%;
  background:linear-gradient(90deg,var(--gold) 0 5px,rgba(37,133,255,.95) 5px,rgba(37,133,255,.55) 38%,rgba(195,37,216,.18) 70%,transparent);
  clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.mi.on::after{content:'›';position:absolute;right:-6px;top:50%;transform:translateY(-55%);font:800 30px/1 var(--ui);color:var(--gold)}
.mi.off{opacity:.45}
.menu.sm .mi{font-size:24px}
.lst{position:relative;overflow-y:auto;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 18px),transparent);padding-top:6px;padding-bottom:10px;overflow-x:hidden;max-height:100%;scrollbar-width:none;padding-right:2px}.lst::-webkit-scrollbar{display:none}
.left.top{justify-content:flex-start}

/* ---------- карточки, строки настроек, кнопки ---------- */
.glass{background:linear-gradient(180deg,rgba(18,40,70,.78),rgba(8,20,38,.82));border:1px solid rgba(143,216,255,.18);border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.logo{width:min(52vh,40vw);max-width:300px;aspect-ratio:1;filter:drop-shadow(0 10px 40px rgba(120,60,255,.45));opacity:.97}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;position:relative}
.row .k{flex:1;font:800 italic 17px/1.1 var(--sport);text-transform:uppercase;color:var(--dim);white-space:nowrap}
.row .v{display:flex;align-items:center;gap:8px;font:800 italic 18px/1 var(--sport);text-transform:uppercase;white-space:nowrap}
.row .v .ar{color:var(--gold);font:800 18px/1 var(--ui);opacity:.9}
.row.on{background:linear-gradient(90deg,rgba(37,133,255,.55),rgba(37,133,255,.12) 70%,transparent);box-shadow:inset 4px 0 0 var(--gold)}
.row.on .k{color:#fff}
.tog{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;flex:none}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#cfd8e3}
.tog.on{background:linear-gradient(90deg,var(--blu),var(--cyan))}.tog.on::after{left:23px;background:#fff}
.bar{width:120px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);position:relative;flex:none}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--blu),var(--cyan))}
.bar i::after{content:'';position:absolute;right:-7px;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(37,133,255,.5)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 22px;border-radius:12px;
  font:800 italic 21px/1 var(--sport);text-transform:uppercase;color:#241703;white-space:nowrap;
  background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 6px 20px rgba(240,169,46,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.btn.focus{outline:3px solid #fff;outline-offset:2px}

/* ---------- подвал: сейчас играет + подсказки ---------- */
.np{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 10px;border-radius:12px;min-width:0;max-width:52%;
  background:linear-gradient(90deg,rgba(6,14,28,.85),rgba(6,14,28,.55));border-left:3px solid var(--mag)}
.eq{display:flex;align-items:flex-end;gap:2px;height:18px;flex:none}
.eq i{width:3px;border-radius:1px;background:linear-gradient(180deg,var(--cyan),var(--blu));animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(1){height:40%}.eq i:nth-child(2){height:90%;animation-delay:-.4s}.eq i:nth-child(3){height:60%;animation-delay:-.7s}.eq i:nth-child(4){height:75%;animation-delay:-.2s}
@keyframes eq{to{transform:scaleY(.35)}}
.np .tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.np .lb{font:700 9px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.np .tr{font:800 italic 15px/1.1 var(--sport);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .al{font:600 11px/1.2 var(--ui);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hints{display:flex;gap:14px;align-items:center;flex:none}
.h{display:flex;align-items:center;gap:6px;font:800 italic 14px/1 var(--sport);text-transform:uppercase;color:var(--dim);white-space:nowrap}
.gb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  font:800 12px/1 var(--ui);font-style:normal;color:#0a1420}
.gb.a{background:#5ad07f}.gb.b{background:#e8736f}.gb.x{background:#7fb0ff}.gb.y{background:#ffd166}
.gb.rt{background:#9aa6b8;border-radius:6px;width:auto;padding:0 5px}.gb.lb{background:#b9c4d6;border-radius:6px;width:auto;padding:0 5px}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 6px;border-radius:5px;
  font:700 11px/1 var(--ui);color:#0a1420;background:#dfe7f1;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}

/* ---------- подготовка матча ---------- */
.prep{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:center;height:100%}
.teams{display:flex;align-items:center;justify-content:center;gap:6px}
.tc{position:relative;width:min(150px,20vw);padding:10px 8px 12px;text-align:center;border-radius:14px}
.tc .lbl{font:700 10px/1 var(--ui);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.tc .nm{font:800 italic 20px/1 var(--sport);text-transform:uppercase;margin-top:6px}
.tc .sw{display:flex;justify-content:center;gap:5px;margin-top:7px}.tc .sw i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.tc .nav{position:absolute;top:44%;left:-4px;right:-4px;display:flex;justify-content:space-between;font:800 26px/1 var(--ui);color:var(--gold)}
.tc.on{box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(0,0,0,.35)}
.tc svg{width:74%;height:auto;margin-top:6px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.vs{font:800 italic 30px/1 var(--sport);color:var(--gold);text-shadow:0 0 18px rgba(255,209,102,.5);padding:0 2px}
.opts{display:flex;flex-direction:column;gap:6px}
.note{font:600 12px/1.35 var(--ui);color:var(--dim)}

/* ---------- комната ---------- */
.room{padding:16px 18px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.code{font:800 italic 54px/1 var(--sport);letter-spacing:.14em;color:#fff;text-shadow:0 0 22px rgba(143,216,255,.45)}
.wait{display:flex;align-items:center;gap:8px;font:700 13px/1.2 var(--ui);color:var(--cyan)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(143,216,255,.7);animation:pulse 1.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(143,216,255,0)}}

/* ---------- тренировка ---------- */
.les{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 4px;position:relative;border-radius:8px}
.les .n{width:22px;font:800 italic 15px/1 var(--sport);color:var(--mute);text-align:right}
.les .t{flex:1;font:800 italic 18px/1.1 var(--sport);text-transform:uppercase;color:rgba(214,228,244,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les.on{background:linear-gradient(90deg,rgba(37,133,255,.6),rgba(37,133,255,.15) 75%,transparent);box-shadow:inset 4px 0 0 var(--gold)}
.les.on .t{color:#fff}.les.ok .t::after{content:' ✓';color:#5ad07f}
.md{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.25)}
.md.g{background:radial-gradient(circle at 35% 30%,#fff3b0,#f2b92c 55%,#a8740c)}
.md.s{background:radial-gradient(circle at 35% 30%,#ffffff,#c3ccd8 55%,#7d8796)}
.md.b{background:radial-gradient(circle at 35% 30%,#ffd9b0,#c9803c 55%,#80471a)}
.md.e{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.medals{display:flex;gap:4px}
.card{padding:14px 16px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:8px}
.card h3{font:800 italic 22px/1.05 var(--sport);text-transform:uppercase}
.card .task{font:600 13px/1.4 var(--ui);color:#dbe6f3}
.card .goal{display:flex;flex-direction:column;gap:5px;font:600 12px/1.3 var(--ui);color:var(--dim)}
.card .goal div{display:flex;align-items:center;gap:8px}
.best{font:800 italic 14px/1 var(--sport);text-transform:uppercase;color:var(--gold)}

/* ---------- урок (поверх матча) ---------- */
.hud-task{position:fixed;top:calc(var(--top) + 8px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 18px 9px;border-radius:12px;background:rgba(6,14,28,.82);border:1px solid rgba(143,216,255,.25);max-width:62vw;text-align:center}
.hud-task .ln{font:800 italic 12px/1 var(--sport);letter-spacing:.08em;color:var(--cyan);text-transform:uppercase}
.hud-task .tk{font:800 italic 19px/1.1 var(--sport);text-transform:uppercase}
.hud-cnt{position:fixed;top:calc(var(--top) + 8px);left:calc(var(--sl) + 18px);display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-radius:12px;background:rgba(6,14,28,.82)}
.hud-cnt b{font:800 italic 26px/1 var(--sport)}.hud-cnt span{font:700 10px/1 var(--ui);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.hud-tip{position:fixed;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  padding:9px 16px;border-radius:999px;background:rgba(6,14,28,.85);border:1px solid rgba(255,209,102,.4);font:800 italic 16px/1 var(--sport);text-transform:uppercase;white-space:nowrap}
.hud-med{position:fixed;top:calc(var(--top) + 8px);right:calc(var(--sr) + 70px);display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-radius:12px;background:rgba(6,14,28,.82);font:700 11px/1.2 var(--ui);color:var(--dim)}
.hud-med div{display:flex;align-items:center;gap:6px}
.target{position:fixed;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 4px rgba(232,115,111,.8),0 0 16px rgba(255,80,80,.7);background:radial-gradient(circle,#e8736f 0 30%,transparent 32%)}
.target.hit{box-shadow:0 0 0 4px rgba(90,208,127,.9),0 0 16px rgba(90,208,127,.8);background:radial-gradient(circle,#5ad07f 0 30%,transparent 32%)}
.done{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.done .card{max-width:420px;align-items:center;text-align:center;gap:10px;padding:20px 24px}
.done .big{font:800 italic 40px/1 var(--sport);color:#5ad07f;text-transform:uppercase}
.bigmd{width:74px;height:74px}
.stat3{display:flex;gap:18px}.stat3 div{display:flex;flex-direction:column;gap:3px}.stat3 b{font:800 italic 24px/1 var(--sport)}.stat3 span{font:700 10px/1 var(--ui);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}

/* ---------- правила и управление ---------- */
.tabs{display:flex;gap:6px}
.tab{padding:8px 14px;border-radius:10px;font:800 italic 16px/1 var(--sport);text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.06);white-space:nowrap}
.tab.on{color:#241703;background:linear-gradient(180deg,var(--gold),var(--gold2))}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;align-content:start;overflow:hidden;height:100%}
.rule{padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.rule svg{flex:none;width:50px;height:34px}
.rule h4{font:800 italic 16px/1 var(--sport);text-transform:uppercase;margin-bottom:4px}
.rule p{font:600 11.5px/1.35 var(--ui);color:var(--dim)}
.rule.on{box-shadow:0 0 0 2px var(--gold)}
.dev{display:flex;gap:6px}
.scheme{position:relative;width:100%;height:100%;min-height:150px}
.scheme svg{width:100%;height:100%}

/* ---------- пауза ---------- */
.score{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:rgba(6,14,28,.85);font:800 italic 22px/1 var(--sport)}
.score .c{width:10px;height:22px;border-radius:3px}.score .t{font-size:14px;color:var(--gold);margin-left:6px}

/* ---------- низкая горизонталь (телефон боком): всё компактнее ---------- */
@media (orientation:landscape) and (max-height:460px){
  .scr{gap:4px 18px}
  .brand{font-size:28px}.brand::after{margin-top:3px;height:2px}
  .title{font-size:25px}
  .mi{font-size:clamp(19px,6.2vh,27px);padding:3px 0 3px 4px}
  .mi .d{font-size:11px;margin-top:1px}
  .menu{margin-top:4px}
  .np{padding:5px 12px 5px 9px}.np .tr{font-size:14px}
  .row{padding:5px 12px}.row .k{font-size:15px}.row .v{font-size:16px}
  .btn{height:40px;font-size:19px}
  .les{padding:3px 10px 3px 4px}.les .t{font-size:16px}
